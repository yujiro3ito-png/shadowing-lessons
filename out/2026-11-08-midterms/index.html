<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voters send a clear message to Washington</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#e9e6df; --paper:#fbfaf6; --ink:#1d1d1b; --muted:#6b6a65; --rule:#2b2b2b;
  --band:#8a8a88; --band-ink:#fff; --hl:#fff2b3; --hl-line:#e0b400; --gutter:rgba(0,0,0,.10);
  --bar:#1f1f1e; --bar-ink:#f4f3ef; --accent:#c8a200;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#151514; --paper:#22221f; --ink:#e9e7e1; --muted:#a3a19a; --rule:#cfcdc6;
    --band:#5c5c59; --band-ink:#fff; --hl:#4a4120; --hl-line:#d8b42a; --gutter:rgba(0,0,0,.45);
    --bar:#0d0d0c; --bar-ink:#f4f3ef;
  }
}
:root[data-theme="dark"]{
  --desk:#151514; --paper:#22221f; --ink:#e9e7e1; --muted:#a3a19a; --rule:#cfcdc6;
  --band:#5c5c59; --band-ink:#fff; --hl:#4a4120; --hl-line:#d8b42a; --gutter:rgba(0,0,0,.45);
  --bar:#0d0d0c; --bar-ink:#f4f3ef;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;padding:24px 16px 120px}
.spread{max-width:1240px;margin:0 auto 32px;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.10);border-radius:4px;position:relative}
.spread::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:36px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,var(--gutter) 50%,transparent);pointer-events:none}
.page{padding:44px 52px 56px;position:relative;min-height:640px;display:flex;flex-direction:column}
.runhead{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.02em;color:var(--ink);margin-bottom:28px}
.runhead::after{content:"";flex:1;border-top:1px solid var(--rule)}
.page.ja .runhead{flex-direction:row-reverse}
.track{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;cursor:pointer;border:0;background:none;color:inherit;padding:0}
.track i{width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:9px}
h1{font-family:"Source Serif 4",Georgia,serif;font-size:30px;line-height:1.15;margin:0 0 6px;font-weight:700}
h2.sub{font-family:"Source Serif 4",Georgia,serif;font-size:19px;line-height:1.3;margin:0 0 14px;font-weight:700}
.page.ja h1{font-family:"Noto Serif JP",serif;font-size:24px;line-height:1.45;font-weight:700;margin-bottom:2px}
.page.ja h2.sub{font-family:"Noto Serif JP",serif;font-size:18px;font-weight:700}
.source{text-align:right;font-size:12px;color:var(--muted);margin:0 0 22px}
.source::before{content:"● "}
h3{font-family:"Source Serif 4",Georgia,serif;font-size:17px;margin:4px 0 8px;font-weight:700}
.page.ja h3{font-family:"Noto Sans JP",sans-serif;font-size:15px}
.en p{font-family:"Source Serif 4",Georgia,serif;font-size:18px;line-height:1.72;margin:0;text-indent:1.4em;text-align:justify;hyphens:auto}
.ja p{font-family:"Noto Serif JP",serif;font-size:15px;line-height:2.0;margin:0;text-indent:1em;text-align:justify}
.para{cursor:pointer;border-radius:3px;transition:background .2s;padding:1px 4px;margin:0 -4px}
.para:hover{background:color-mix(in srgb,var(--hl) 45%,transparent)}
.para.on{background:var(--hl);box-shadow:inset 3px 0 0 var(--hl-line)}
body.hide-en .en .body{filter:blur(6px);user-select:none}
body.hide-en .en .para.on{filter:none}
body.hide-ja .ja .body{filter:blur(5px)}
.words{margin-top:auto;padding-top:28px}
.words .band{background:var(--band);color:var(--band-ink);font-weight:700;font-size:14px;padding:5px 14px;border-radius:999px 999px 0 0;width:92%}
.words ul{list-style:none;margin:0;padding:10px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:4px 14px;font-size:13px}
.words li{display:flex;gap:6px;align-items:baseline}
.words label{display:block;cursor:pointer;padding-left:20px;text-indent:-20px;line-height:1.5}
.words input{margin:0 6px 0 0;vertical-align:-1px;accent-color:var(--accent)}
.words b{font-family:"Source Serif 4",Georgia,serif;font-weight:400;font-size:14px;margin-right:6px}
.words span{color:var(--muted)}
.folio{position:absolute;bottom:18px;font-size:13px;color:var(--muted)}
.en .folio{left:52px}.ja .folio{right:52px}
/* player */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);color:var(--bar-ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:10}
.bar .in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.bar button,.bar select{font:inherit;font-size:13px;color:inherit;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:6px 10px;cursor:pointer}
.bar button.on{background:var(--accent);border-color:var(--accent);color:#111}
.bar .play{width:44px;height:36px;font-size:16px}
.seek{flex:1;min-width:160px;display:flex;align-items:center;gap:8px;font-size:12px;font-variant-numeric:tabular-nums}
.seek input{flex:1;accent-color:var(--accent)}
@media (max-width:860px){
  .spread{grid-template-columns:1fr}
  .spread::after{display:none}
  .page{padding:28px 18px 48px;min-height:0}
  .page.ja{border-top:1px dashed var(--gutter)}
  h1{font-size:25px}
  .en p{font-size:17px}
  .folio{display:none}
  body{padding:12px 0 150px}
  .spread{border-radius:0}
}
@media print{
  body{background:#fff;padding:0}
  .bar{display:none}
  .spread{box-shadow:none;break-after:page;margin:0;max-width:none}
  .para.on{background:none;box-shadow:none}
  body.hide-en .en .body,body.hide-ja .ja .body{filter:none}
  @page{size:A4 landscape;margin:10mm}
}
</style>
</head>
<body>
<main id="book"></main>
<audio id="au" preload="auto"></audio>
<div class="bar"><div class="in">
  <button class="play" id="play" aria-label="再生">▶</button>
  <button id="prev" aria-label="前の段落">⏮</button>
  <button id="next" aria-label="次の段落">⏭</button>
  <div class="seek"><span id="cur">0:00</span><input type="range" id="pos" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  <select id="rate" aria-label="速度">
    <option value="0.7">0.7×</option><option value="0.8">0.8×</option><option value="0.9">0.9×</option>
    <option value="1" selected>1.0×</option><option value="1.1">1.1×</option><option value="1.2">1.2×</option>
  </select>
  <button id="loop" title="今の段落をくり返す">段落リピート</button>
  <button id="hideEn" title="英文をぼかす（音だけでシャドーイング）">英文を隠す</button>
  <button id="hideJa">訳を隠す</button>
</div></div>
<script>
const D = {"meta": {"series_en": "World Affairs 1", "series_ja": "国際・政治 1", "track": "01", "title_en": "Voters send a clear message to Washington", "subtitle_en": "Japan must prepare for a divided America", "title_ja": "米中間選挙　有権者が突きつけた明確な審判", "subtitle_ja": "分断する米国に日本は備えを", "source_en": "Original text based on reports from AP, NPR and NBC News, Nov. 2026", "date_ja": "2026年11月8日作成", "start_page": 14, "voice": "Samantha", "rate": 145, "pause_sec": 1.0}, "sections": [{"heading_en": "", "heading_ja": "", "paragraphs": [{"en": "Americans went to the polls on Nov. 3, and the result was a clear rebuke to President Donald Trump and the Republican Party. Democrats won control of both the House of Representatives and the Senate, ending two years of unified Republican rule in Washington.", "ja": "米国の有権者は11月3日に投票し、その結果はトランプ大統領と共和党に対する明確な批判となった。民主党は下院と上院の両方で多数派を獲得し、2年間続いた共和党によるワシントンの一体的な支配に終止符を打った。"}, {"en": "It is not unusual for the president's party to lose ground in a midterm election. Between 1934 and 2018, the party in the White House lost an average of 28 House seats. This time, however, the scale of the shift in the Senate stands out.", "ja": "中間選挙で大統領の党が議席を減らすこと自体は珍しくない。1934年から2018年までの間、政権党は下院で平均28議席を失ってきた。しかし今回は、上院での変化の大きさが際立っている。"}, {"en": "Democrats flipped Senate seats in states that had long been considered safe for Republicans, including North Carolina, Ohio and Texas. In Texas, Democrat James Talarico defeated Attorney General Ken Paxton, a close ally of the president.", "ja": "民主党は、ノースカロライナ、オハイオ、テキサスなど、長く共和党の牙城とみなされてきた州で上院議席を奪った。テキサス州では、民主党のジェームズ・タラリコ氏が、大統領に近い州司法長官のケン・パクストン氏を破った。"}, {"en": "The results were felt in governors' races as well. Democrats won the governorship in Georgia, a key battleground state, while Republicans held on to Florida. Across the country, turnout was high, a sign of how strongly many Americans felt about the direction of their nation.", "ja": "結果は知事選にも表れた。民主党は激戦州ジョージアで知事の座を獲得し、共和党はフロリダを守った。全米で投票率は高く、多くの米国民が国の進む方向に強い関心を抱いていることをうかがわせた。"}, {"en": "Several races, including Senate contests in Alaska and Mississippi, had yet to be decided days after the vote. Even so, the overall direction is unmistakable.", "ja": "アラスカ州やミシシッピ州の上院選など、投票から数日たっても決着していない選挙区もある。それでも、全体の流れは明らかだ。"}], "vocab": [{"w": "go to the polls", "m": "投票に行く"}, {"w": "rebuke", "m": "非難、叱責"}, {"w": "unified", "m": "統一された、一体の"}, {"w": "lose ground", "m": "後退する、勢力を失う"}, {"w": "stand out", "m": "際立つ、目立つ"}, {"w": "flip", "m": "（議席・州を）奪う、ひっくり返す"}, {"w": "ally", "m": "盟友、同盟国"}, {"w": "unmistakable", "m": "紛れもない、明白な"}, {"w": "battleground state", "m": "激戦州"}, {"w": "turnout", "m": "投票率"}]}, {"heading_en": "Prices and war weigh on voters", "heading_ja": "物価と戦争が有権者に重く", "paragraphs": [{"en": "What drove voters to change course? According to the AP's survey of voters, about six in 10 disapproved of the way Trump has handled his job as president. Many said they were struggling with high prices, and concerns over the conflict with Iran also appear to have played a role.", "ja": "何が有権者に方向転換を促したのか。AP通信の有権者調査によると、約6割がトランプ氏の大統領としての仕事ぶりを支持しなかった。多くの人が物価高に苦しんでいると答え、イランとの紛争への懸念も影響したとみられる。"}, {"en": "Young people and Latino voters, two groups that had moved toward Republicans in 2024, shifted back toward Democrats. That swing suggests that the coalition which returned Trump to the White House two years ago was more fragile than it seemed.", "ja": "2024年に共和党寄りに動いた若者とヒスパニック系の有権者は、再び民主党へと戻った。この揺り戻しは、2年前にトランプ氏をホワイトハウスに返り咲かせた支持基盤が、見た目以上にもろかったことを示している。"}, {"en": "Rising costs for food, housing and health care have put pressure on households across the country. Although the administration argued that its tariffs would protect American workers, many voters felt that the policy had instead made everyday goods more expensive.", "ja": "食料や住宅、医療の費用上昇は、全米の家計を圧迫している。政権は関税が米国の労働者を守ると主張したが、多くの有権者はむしろ日用品が値上がりしたと感じた。"}, {"en": "Republicans also appear to have been hurt by their own strategy. Efforts to redraw district maps in their favor were expected to add seats, but some analysts now say the new maps may have backfired.", "ja": "共和党は自らの戦略によっても打撃を受けたようだ。自党に有利になるよう選挙区割りを変更すれば議席が増えると見込まれていたが、新たな区割りは裏目に出た可能性があると指摘する専門家もいる。"}, {"en": "Of course, a midterm victory does not guarantee success in the next presidential election. Democrats still lack a clear leader and a unified message, and they must now show that they can govern, not just oppose.", "ja": "もちろん、中間選挙での勝利が次の大統領選での成功を保証するわけではない。民主党には依然として明確な指導者も統一されたメッセージもない。反対するだけでなく、統治できることを示さなければならない。"}], "vocab": [{"w": "weigh on ~", "m": "～に重くのしかかる"}, {"w": "change course", "m": "方針を転換する"}, {"w": "disapprove of ~", "m": "～を支持しない、認めない"}, {"w": "struggle with ~", "m": "～に苦しむ"}, {"w": "swing", "m": "（支持の）変動、揺れ"}, {"w": "coalition", "m": "連合、支持基盤"}, {"w": "fragile", "m": "もろい、壊れやすい"}, {"w": "redraw", "m": "引き直す（区割りを変更する）"}, {"w": "backfire", "m": "裏目に出る"}, {"w": "govern", "m": "統治する"}, {"w": "household", "m": "世帯、家計"}, {"w": "everyday goods", "m": "日用品"}]}, {"heading_en": "A new era of divided government", "heading_ja": "「ねじれ」の新時代へ", "paragraphs": [{"en": "With Congress now in Democratic hands, the president will find it much harder to pass legislation. Budgets, tax measures and trade policy will all require negotiation with the opposition.", "ja": "議会が民主党の手に渡ったことで、大統領が法案を成立させるのははるかに難しくなる。予算、税制措置、通商政策はいずれも野党との交渉が必要になる。"}, {"en": "Democrats are also expected to use their new power to launch investigations into the administration. If the two sides choose confrontation over compromise, Washington could be paralyzed, and the political divide among Americans could deepen even further.", "ja": "民主党は新たな権限を使い、政権に対する調査に乗り出すとみられる。双方が妥協より対決を選べば、ワシントンは機能不全に陥り、米国民の政治的分断はさらに深まりかねない。"}, {"en": "For the next two years, the president is likely to rely more heavily on executive orders. However, governing through such orders can be fragile, because they can be challenged in court or easily reversed by a future administration.", "ja": "今後2年間、大統領は大統領令への依存を強めるとみられる。しかし、大統領令による統治は不安定になりやすい。裁判で争われたり、将来の政権によって簡単に覆されたりするからだ。"}, {"en": "There are already worrying signs, as a legal dispute has emerged over the Senate race in Alaska. Respect for the outcome of elections is the very foundation of democracy, and it must not be undermined.", "ja": "アラスカ州の上院選を巡って法的な争いが起きるなど、すでに気がかりな兆候もある。選挙結果の尊重は民主主義の根幹であり、損なわれてはならない。"}], "vocab": [{"w": "divided government", "m": "分割政府（「ねじれ」状態）"}, {"w": "legislation", "m": "法律、法案"}, {"w": "measure", "m": "措置、法案"}, {"w": "the opposition", "m": "野党"}, {"w": "launch", "m": "開始する、乗り出す"}, {"w": "confrontation", "m": "対決、対立"}, {"w": "compromise", "m": "妥協"}, {"w": "paralyze", "m": "麻痺させる"}, {"w": "dispute", "m": "争い、論争"}, {"w": "undermine", "m": "損なう、むしばむ"}, {"w": "executive order", "m": "大統領令"}, {"w": "reverse", "m": "覆す、撤回する"}]}, {"heading_en": "What Japan should do", "heading_ja": "日本が取るべき道", "paragraphs": [{"en": "For Japan, the outcome has important implications. Trump may now turn his attention to foreign policy and trade, where he can act without the approval of Congress. Pressure on allies to spend more on defense and to accept new tariffs could intensify.", "ja": "日本にとって、この結果は重要な意味を持つ。トランプ氏は今後、議会の承認なしに動ける外交や通商に目を向ける可能性がある。同盟国に防衛費の増額や新たな関税の受け入れを求める圧力が強まるかもしれない。"}, {"en": "Japan should therefore deepen its ties not only with the White House but also with members of Congress from both parties. Building a broad network of support in Washington is the best insurance against sudden changes in policy.", "ja": "したがって日本は、ホワイトハウスだけでなく、与野党双方の議員との関係も深めるべきだ。ワシントンに幅広い支持のネットワークを築くことが、急な政策転換に対する最善の備えとなる。"}, {"en": "Japan's economy is also closely tied to that of the United States. The government should carefully analyze how changes in American trade policy could affect Japanese companies, and prepare measures to support industries that may be hit hard, such as automobiles.", "ja": "日本経済は米国経済とも密接に結びついている。政府は米国の通商政策の変化が日本企業にどう影響するかを慎重に分析し、自動車など大きな打撃を受けかねない産業を支える策を用意すべきだ。"}, {"en": "The United States remains Japan's most important ally. Precisely because American politics is in flux, Japan must think for itself, strengthen cooperation with like-minded countries, and work to keep the international order stable.", "ja": "米国は引き続き日本にとって最も重要な同盟国である。米国政治が流動的だからこそ、日本は自ら考え、価値観を共有する国々との協力を強化し、国際秩序の安定に努めなければならない。"}], "vocab": [{"w": "implication", "m": "影響、含意"}, {"w": "turn one's attention to ~", "m": "～に注意を向ける"}, {"w": "approval", "m": "承認"}, {"w": "tariff", "m": "関税"}, {"w": "intensify", "m": "強まる、激化する"}, {"w": "ties", "m": "関係、つながり"}, {"w": "insurance against ~", "m": "～に対する備え、保険"}, {"w": "in flux", "m": "流動的で、変化している"}, {"w": "like-minded", "m": "同じ考えを持つ、価値観を共有する"}, {"w": "be tied to ~", "m": "～と結びついている"}, {"w": "be hit hard", "m": "大きな打撃を受ける"}]}], "timings": [[0.0, 16.75], [17.75, 32.66], [33.66, 48.18], [49.18, 65.59], [66.59, 76.96], [77.96, 93.42], [94.42, 109.54], [110.54, 125.9], [126.9, 137.74], [138.74, 151.25], [152.25, 162.86], [163.86, 178.62], [179.62, 192.72], [193.72, 205.72], [206.72, 221.07], [222.07, 236.42], [237.42, 253.02], [254.02, 267.63]], "audio": "audio.m4a"};
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
const KEY = 'shadow:' + D.meta.title_en;
const checked = store.get(KEY) || {};
const m = D.meta;
let pi = 0, page = m.start_page || 1, html = '';
D.sections.forEach((s, si) => {
  const first = si === 0;
  const enP = s.paragraphs.map(p => `<p class="para" data-i="${pi++}">${esc(p.en)}</p>`).join('');
  pi -= s.paragraphs.length;
  const jaP = s.paragraphs.map(p => `<p class="para" data-i="${pi++}">${esc(p.ja)}</p>`).join('');
  const vocab = s.vocab.map((v, vi) => { const id = `v${si}-${vi}`;
    return `<li><label><input type="checkbox" data-k="${id}" ${checked[id]?'checked':''}><b>${esc(v.w)}</b><span>${esc(v.m)}</span></label></li>`; }).join('');
  html += `<section class="spread">
    <div class="page en">
      <div class="runhead">${esc(m.series_en)} <button class="track" data-s="${si}"><i>▶</i>Track ${esc(m.track)}</button></div>
      ${first ? `<h1>${esc(m.title_en)}</h1><h2 class="sub">${esc(m.subtitle_en)}</h2><p class="source">${esc(m.source_en)}</p>` : ''}
      ${s.heading_en ? `<h3>${esc(s.heading_en)}</h3>` : ''}
      <div class="body">${enP}</div>
      <span class="folio">${page}</span>
    </div>
    <div class="page ja">
      <div class="runhead">${esc(m.series_ja)}</div>
      ${first ? `<h1>${esc(m.title_ja)}</h1><h2 class="sub">${esc(m.subtitle_ja)}</h2><p class="source">${esc(m.date_ja)}</p>` : ''}
      ${s.heading_ja ? `<h3>${esc(s.heading_ja)}</h3>` : ''}
      <div class="body">${jaP}</div>
      <div class="words"><div class="band">Words and Phrases</div><ul>${vocab}</ul></div>
      <span class="folio">${page + 1}</span>
    </div></section>`;
  page += 2;
});
$('#book').innerHTML = html;

const au = $('#au');
// 音声を丸ごと読み込んでから再生する（Range 非対応のサーバーでもシークできるように）
fetch(D.audio).then(r => { if (!r.ok) throw 0; return r.blob(); })
  .then(b => au.src = URL.createObjectURL(b)).catch(() => au.src = D.audio);
const T = D.timings, fmt = t => `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
let loop = false, cur = -1;
const idxAt = t => { for (let i = T.length - 1; i >= 0; i--) if (t >= T[i][0] - 0.05) return i; return 0; };
const seekTo = i => { i = Math.max(0, Math.min(T.length - 1, i)); au.currentTime = T[i][0]; mark(i); au.play(); };
function mark(i){
  if (i === cur) return; cur = i;
  document.querySelectorAll('.para.on').forEach(e => e.classList.remove('on'));
  document.querySelectorAll(`.para[data-i="${i}"]`).forEach(e => e.classList.add('on'));
  const el = document.querySelector(`.en .para[data-i="${i}"]`);
  if (el && !au.paused) { const r = el.getBoundingClientRect(); if (r.top < 60 || r.bottom > innerHeight - 110) el.scrollIntoView({behavior:'smooth', block:'center'}); }
}
au.addEventListener('loadedmetadata', () => $('#dur').textContent = fmt(au.duration));
au.addEventListener('timeupdate', () => {
  const t = au.currentTime;
  if (loop && cur >= 0 && t >= T[cur][1] + 0.4) { au.currentTime = T[cur][0]; return; }
  mark(idxAt(t));
  $('#cur').textContent = fmt(t);
  if (au.duration) $('#pos').value = t / au.duration * 1000;
});
au.addEventListener('play', () => $('#play').textContent = '❚❚');
au.addEventListener('pause', () => $('#play').textContent = '▶');
$('#play').onclick = () => au.paused ? au.play() : au.pause();
$('#prev').onclick = () => seekTo((cur < 0 ? 0 : cur) - 1);
$('#next').onclick = () => seekTo(cur + 1);
$('#pos').oninput = e => { if (au.duration) au.currentTime = e.target.value / 1000 * au.duration; };
$('#rate').onchange = e => au.playbackRate = +e.target.value;
const tog = (id, fn) => $(id).onclick = e => { e.currentTarget.classList.toggle('on'); fn(e.currentTarget.classList.contains('on')); };
tog('#loop', v => loop = v);
tog('#hideEn', v => document.body.classList.toggle('hide-en', v));
tog('#hideJa', v => document.body.classList.toggle('hide-ja', v));
document.addEventListener('click', e => {
  const p = e.target.closest('.para'); if (p) return seekTo(+p.dataset.i);
  const t = e.target.closest('.track'); if (t) { const s = +t.dataset.s; let i = 0; for (let k = 0; k < s; k++) i += D.sections[k].paragraphs.length; seekTo(i); }
});
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.k; if (k) { checked[k] = e.target.checked; store.set(KEY, checked); } });
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); $('#play').click(); }
  if (e.code === 'ArrowRight') seekTo(cur + 1); if (e.code === 'ArrowLeft') seekTo(cur - 1); });
</script>
</body>
</html>
