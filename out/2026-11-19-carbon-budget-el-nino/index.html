<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fossil emissions dip for the first time since the pandemic, but forests and El Niño cloud the good news</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#e9e6df; --paper:#fbfaf6; --ink:#1d1d1b; --muted:#6b6a65; --rule:#2b2b2b;
  --band:#8a8a88; --band-ink:#fff; --hl:#fff2b3; --hl-line:#e0b400; --gutter:rgba(0,0,0,.10);
  --bar:#1f1f1e; --bar-ink:#f4f3ef; --accent:#c8a200;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#151514; --paper:#22221f; --ink:#e9e7e1; --muted:#a3a19a; --rule:#cfcdc6;
    --band:#5c5c59; --band-ink:#fff; --hl:#4a4120; --hl-line:#d8b42a; --gutter:rgba(0,0,0,.45);
    --bar:#0d0d0c; --bar-ink:#f4f3ef;
  }
}
:root[data-theme="dark"]{
  --desk:#151514; --paper:#22221f; --ink:#e9e7e1; --muted:#a3a19a; --rule:#cfcdc6;
  --band:#5c5c59; --band-ink:#fff; --hl:#4a4120; --hl-line:#d8b42a; --gutter:rgba(0,0,0,.45);
  --bar:#0d0d0c; --bar-ink:#f4f3ef;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;padding:24px 16px 120px}
.spread{max-width:1240px;margin:0 auto 32px;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.10);border-radius:4px;position:relative}
.spread::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:36px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,var(--gutter) 50%,transparent);pointer-events:none}
.page{padding:44px 52px 56px;position:relative;min-height:640px;display:flex;flex-direction:column}
.runhead{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.02em;color:var(--ink);margin-bottom:28px}
.runhead::after{content:"";flex:1;border-top:1px solid var(--rule)}
.page.ja .runhead{flex-direction:row-reverse}
.track{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;cursor:pointer;border:0;background:none;color:inherit;padding:0}
.track i{width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:9px}
h1{font-family:"Source Serif 4",Georgia,serif;font-size:30px;line-height:1.15;margin:0 0 6px;font-weight:700}
h2.sub{font-family:"Source Serif 4",Georgia,serif;font-size:19px;line-height:1.3;margin:0 0 14px;font-weight:700}
.page.ja h1{font-family:"Noto Serif JP",serif;font-size:24px;line-height:1.45;font-weight:700;margin-bottom:2px}
.page.ja h2.sub{font-family:"Noto Serif JP",serif;font-size:18px;font-weight:700}
.source{text-align:right;font-size:12px;color:var(--muted);margin:0 0 22px}
.source::before{content:"● "}
h3{font-family:"Source Serif 4",Georgia,serif;font-size:17px;margin:4px 0 8px;font-weight:700}
.page.ja h3{font-family:"Noto Sans JP",sans-serif;font-size:15px}
.en p{font-family:"Source Serif 4",Georgia,serif;font-size:18px;line-height:1.72;margin:0;text-indent:1.4em;text-align:justify;hyphens:auto}
.ja p{font-family:"Noto Serif JP",serif;font-size:15px;line-height:2.0;margin:0;text-indent:1em;text-align:justify}
.para{cursor:pointer;border-radius:3px;transition:background .2s;padding:1px 4px;margin:0 -4px}
.para:hover{background:color-mix(in srgb,var(--hl) 45%,transparent)}
.para.on{background:var(--hl);box-shadow:inset 3px 0 0 var(--hl-line)}
body.hide-en .en .body{filter:blur(6px);user-select:none}
body.hide-en .en .para.on{filter:none}
body.hide-ja .ja .body{filter:blur(5px)}
.words{margin-top:auto;padding-top:28px}
.words .band{background:var(--band);color:var(--band-ink);font-weight:700;font-size:14px;padding:5px 14px;border-radius:999px 999px 0 0;width:92%}
.words ul{list-style:none;margin:0;padding:10px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:4px 14px;font-size:13px}
.words li{display:flex;gap:6px;align-items:baseline}
.words label{display:block;cursor:pointer;padding-left:20px;text-indent:-20px;line-height:1.5}
.words input{margin:0 6px 0 0;vertical-align:-1px;accent-color:var(--accent)}
.words b{font-family:"Source Serif 4",Georgia,serif;font-weight:400;font-size:14px;margin-right:6px}
.words span{color:var(--muted)}
.folio{position:absolute;bottom:18px;font-size:13px;color:var(--muted)}
.en .folio{left:52px}.ja .folio{right:52px}
/* player */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);color:var(--bar-ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:10}
.bar .in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.bar button,.bar select{font:inherit;font-size:13px;color:inherit;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:6px 10px;cursor:pointer}
.bar button.on{background:var(--accent);border-color:var(--accent);color:#111}
.bar .play{width:44px;height:36px;font-size:16px}
.seek{flex:1;min-width:160px;display:flex;align-items:center;gap:8px;font-size:12px;font-variant-numeric:tabular-nums}
.seek input{flex:1;accent-color:var(--accent)}
@media (max-width:860px){
  .spread{grid-template-columns:1fr}
  .spread::after{display:none}
  .page{padding:28px 18px 48px;min-height:0}
  .page.ja{border-top:1px dashed var(--gutter)}
  h1{font-size:25px}
  .en p{font-size:17px}
  .folio{display:none}
  body{padding:12px 0 150px}
  .spread{border-radius:0}
}
@media print{
  body{background:#fff;padding:0}
  .bar{display:none}
  .spread{box-shadow:none;break-after:page;margin:0;max-width:none}
  .para.on{background:none;box-shadow:none}
  body.hide-en .en .body,body.hide-ja .ja .body{filter:none}
  @page{size:A4 landscape;margin:10mm}
}
</style>
</head>

<script>
const D = {"meta": {"series_en": "Science & Environment 2", "series_ja": "科学・環境 2", "track": "14", "title_en": "Fossil emissions dip for the first time since the pandemic, but forests and El Niño cloud the good news", "subtitle_en": "A fall of four tenths of one percent is a pause, not a turning point, and Japan should press for firm timelines and protect the forests", "title_ja": "化石燃料の排出、コロナ後初の減少　だが森林とエルニーニョが喜びに影を落とす", "subtitle_ja": "0.4％減は転換点ではなく小休止にすぎない。日本は明確な期限を求め、森林保護にも力を尽くすべきだ", "source_en": "Original text based on reports from the Global Carbon Project, LMU Munich, EurekAlert, PreventionWeb and Anadolu Agency, Nov. 2026", "date_ja": "2026年11月19日作成", "start_page": 14, "voice": "Samantha", "rate": 145, "pause_sec": 1.0, "engine": "openai", "openai_voice": "cedar"}, "sections": [{"heading_en": "", "heading_ja": "", "paragraphs": [{"en": "For the first time since the pandemic, the world may burn slightly less coal, oil and gas this year than last. That is the headline of the new Global Carbon Budget, published on November 10 by an international team of scientists. It is welcome news, but it is far too small to celebrate.", "ja": "パンデミック以来初めて、世界の石炭・石油・天然ガスの消費が前年よりわずかに減る可能性が出てきた。国際的な科学者チームが11月10日に公表した最新の「グローバル・カーボン・バジェット」の見出しである。歓迎すべき知らせだが、祝うには小さすぎる変化だ。"}, {"en": "The researchers project that carbon dioxide from fossil fuels will fall by about 0.4 percent in 2026, to roughly 38.2 billion tonnes. Growth in solar power, wind power and electric vehicles has begun to blunt demand for fossil energy, especially in large economies that spent years adding emissions.", "ja": "研究者らは、化石燃料由来の二酸化炭素が2026年に約0.4％減り、約382億トンになると予測する。太陽光や風力、電気自動車の普及が、化石エネルギーへの需要を鈍らせ始めた。長年排出を増やし続けてきた大国で特に顕著である。"}, {"en": "Yet the picture changes once forests are counted. Emissions from land use are expected to edge up, and the total for this year is projected at 43.3 billion tonnes, compared with 42.8 billion last year. In other words, the planet is still adding more carbon dioxide to the air.", "ja": "だが、森林を含めると状況は変わる。土地利用による排出はわずかに増える見通しで、今年の総排出量は433億トンと、昨年の428億トンを上回ると予測される。つまり、地球は大気に二酸化炭素を足し続けている。"}, {"en": "A decline of four tenths of one percent does not amount to a turning point. It is a pause in a long climb, and the authors warn that geopolitical shocks explain part of the drop. Governments should not mistake a lucky year for a lasting trend.", "ja": "0.4％の減少は転換点とは呼べない。長い上り坂の小休止にすぎず、地政学的な混乱が減少の一部を説明すると執筆者らも注意を促している。各国政府は、幸運な一年を持続的な傾向と取り違えてはならない。"}], "vocab": [{"w": "for the first time since", "m": "〜以来初めて"}, {"w": "burn", "m": "燃やす"}, {"w": "carbon dioxide", "m": "二酸化炭素"}, {"w": "project", "m": "予測する"}, {"w": "blunt", "m": "鈍らせる"}, {"w": "edge up", "m": "わずかに上昇する"}, {"w": "turning point", "m": "転換点"}, {"w": "geopolitical", "m": "地政学的な"}, {"w": "lasting trend", "m": "持続的な傾向"}, {"w": "mistake A for B", "m": "AをBと取り違える"}]}, {"heading_en": "Forests and the Missing Sink", "heading_ja": "森林と失われつつある吸収源", "paragraphs": [{"en": "Deforestation is the weak link. Permanent forest loss has released about 3.8 billion tonnes of carbon dioxide a year over the past decade. Tree planting and regrowth removed about 2.1 billion tonnes annually, so clearing still cancels out far more than replanting can repay.", "ja": "弱点は森林破壊である。この10年間、恒久的な森林の消失は年に約38億トンの二酸化炭素を放出してきた。植林と再生による吸収は年約21億トンで、伐採の影響は植え直しで償える量をはるかに上回っている。"}, {"en": "That imbalance matters for the climate, but also for people. Forests regulate rainfall, shelter wildlife and protect the livelihoods of millions who live beside them. When a forest is cut or burned, the loss is felt first in local water supplies and harvests.", "ja": "この不均衡は気候だけでなく、人々にとっても重大である。森林は降雨を調整し、野生生物を守り、周辺に暮らす何百万もの人々の生活を支える。森が伐られ焼かれれば、まず地元の水資源や収穫に影響が出る。"}, {"en": "Nature has so far been generous with its help. Land and oceans together soak up roughly half of the carbon dioxide that human activity produces. This year the land sink has recovered after a severe weakening during the last strong El Niño, and the ocean sink is expected to hold steady.", "ja": "自然はこれまで、惜しみなく助けてくれた。陸と海は合わせて、人間活動が出す二酸化炭素のおよそ半分を吸収している。今年は、前回の強いエルニーニョで大きく弱まった陸の吸収が回復し、海の吸収も横ばいと見込まれる。"}, {"en": "That generosity should not be taken for granted. Scientists also worry that the number of ocean observations is shrinking, which leaves us watching a vital system with a dimmer lamp. Cutting monitoring budgets would be a false economy, because we cannot manage what we cannot measure.", "ja": "その恩恵を当然と考えてはならない。科学者たちは、海洋観測の数が減っていることも懸念している。重要な仕組みを、暗いランプで見守るようなものだ。観測予算の削減は偽りの節約である。測れないものは管理できない。"}], "vocab": [{"w": "deforestation", "m": "森林破壊"}, {"w": "weak link", "m": "弱点"}, {"w": "regrowth", "m": "再生"}, {"w": "cancel out", "m": "相殺する"}, {"w": "repay", "m": "償う、返す"}, {"w": "livelihood", "m": "生計、暮らし"}, {"w": "soak up", "m": "吸収する"}, {"w": "carbon sink", "m": "炭素吸収源"}, {"w": "take for granted", "m": "当然と思う"}, {"w": "false economy", "m": "偽りの節約"}]}, {"heading_en": "A Stronger El Niño Ahead", "heading_ja": "強まるエルニーニョ", "paragraphs": [{"en": "The next test is already forming in the Pacific. Forecasters say a very strong El Niño is developing, and in August the United States weather agency put the chance of an event stronger than any since 1950 at roughly seven in ten. Japan's weather agency expects it to last into early 2027.", "ja": "次の試練は、すでに太平洋で形づくられている。予報機関は非常に強いエルニーニョが発達しつつあるとし、米国の気象当局は8月、1950年以降のどれよりも強い現象になる確率を約7割と見積もった。気象庁も2027年初めまで続くとみている。"}, {"en": "Researchers expect the effects on the carbon cycle to appear in 2027. During the last episode, drought and heat weakened forests and grasslands so badly that they absorbed far less carbon. A stronger event could push the Amazon, already stressed, closer to a point where fire and dryness feed on each other.", "ja": "研究者らは、炭素循環への影響が2027年に表れるとみる。前回は、干ばつと高温で森林や草原が大きく弱り、吸収量が急減した。より強い現象は、すでに疲弊したアマゾンを、火災と乾燥が互いを助長する段階へ近づけかねない。"}, {"en": "Japan has reasons to pay attention. El Niño years can bring unusual weather across the Pacific rim, including heavy rain, warm winters and strained fisheries. Farmers, insurers and local governments need practical guidance now, not after the first season of losses has arrived.", "ja": "日本にも注視すべき理由がある。エルニーニョの年は、大雨や暖冬、漁業の不振など、環太平洋の各地で異例の天候をもたらしうる。農家や保険会社、自治体は、最初の被害が出た後ではなく、今のうちに実用的な指針を必要としている。"}, {"en": "There is a further warning here. If a natural cycle can erase the gains of a single good year, then progress on emissions must be large and steady enough to survive bad weather. A margin of four tenths of one percent offers no such protection.", "ja": "ここにはさらなる警告がある。自然の周期が一年の成果を消し去りうるなら、排出削減は悪天候に耐えるほど大きく着実でなければならない。0.4％の余裕では、そうした備えにならない。"}], "vocab": [{"w": "forecaster", "m": "予報担当者"}, {"w": "El Niño", "m": "エルニーニョ現象"}, {"w": "carbon cycle", "m": "炭素循環"}, {"w": "grassland", "m": "草原"}, {"w": "feed on", "m": "〜を糧に拡大する"}, {"w": "Pacific rim", "m": "環太平洋地域"}, {"w": "strained", "m": "逼迫した"}, {"w": "practical guidance", "m": "実用的な指針"}, {"w": "erase", "m": "消し去る"}, {"w": "margin", "m": "余裕、差"}]}, {"heading_en": "What Japan Should Do", "heading_ja": "日本が果たすべき役割", "paragraphs": [{"en": "Japan should use the Antalya summit to press for firm timelines. Countries need to turn pledges into dated plans for phasing down coal, oil and gas, and wealthy nations must show where the money will come from. Vague promises have already cost the world years.", "ja": "日本はアンタルヤでの首脳級会合を、明確な期限を迫る場として使うべきだ。各国は公約を、石炭・石油・ガスを段階的に減らす期日入りの計画に変え、富裕国は資金の出どころを示さねばならない。曖昧な約束は、すでに世界の数年を奪った。"}, {"en": "At home, Tokyo can do more than praise efficiency. It can speed up approval of offshore wind and grid connections, support the transmission lines that let renewable power travel, and help Asian neighbors finance cleaner energy instead of exporting aging coal plants.", "ja": "国内では、効率の良さを誇るだけでなく、洋上風力や系統接続の承認を早め、再生可能エネルギーを運ぶ送電線を支援できる。老朽化した石炭火力を輸出するのではなく、アジアの隣国が清潔なエネルギーを賄うのを助けることもできる。"}, {"en": "Abroad, Japan can help protect tropical forests through satellite monitoring and fair payments to communities that guard them. A fall in fossil emissions is a good start. It will count only if governments keep it falling and stop the forests from burning away the progress.", "ja": "海外では、衛星による監視や、森を守る地域社会への適正な対価を通じて、熱帯林の保護に貢献できる。化石燃料由来の排出減は良い出発点だ。政府が減少を続け、森林が進歩を焼き尽くすのを防いでこそ意味を持つ。"}], "vocab": [{"w": "press for", "m": "強く求める"}, {"w": "timeline", "m": "期限、工程表"}, {"w": "pledge", "m": "公約、誓約"}, {"w": "phase down", "m": "段階的に減らす"}, {"w": "vague", "m": "曖昧な"}, {"w": "offshore wind", "m": "洋上風力"}, {"w": "grid connection", "m": "系統接続"}, {"w": "transmission line", "m": "送電線"}, {"w": "aging", "m": "老朽化した"}, {"w": "tropical forest", "m": "熱帯林"}]}], "timings": [[0.0, 17.66], [18.66, 37.67], [38.67, 56.43], [57.43, 72.65], [73.65, 92.9], [93.9, 110.36], [111.36, 128.52], [129.52, 146.37], [147.37, 165.22], [166.22, 185.88], [186.88, 205.6], [206.6, 220.06], [221.06, 236.33], [237.33, 252.93], [253.93, 268.78]], "audio": "audio.m4a"};
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
const KEY = 'shadow:' + D.meta.title_en;
const checked = store.get(KEY) || {};
const m = D.meta;
let pi = 0, page = m.start_page || 1, html = '';
D.sections.forEach((s, si) => {
  const first = si === 0;
  const enP = s.paragraphs.map(p => `<p class="para" data-i="${pi++}">${esc(p.en)}</p>`).join('');
  pi -= s.paragraphs.length;
  const jaP = s.paragraphs.map(p => `<p class="para" data-i="${pi++}">${esc(p.ja)}</p>`).join('');
  const vocab = s.vocab.map((v, vi) => { const id = `v${si}-${vi}`;
    return `<li><label><input type="checkbox" data-k="${id}" ${checked[id]?'checked':''}><b>${esc(v.w)}</b><span>${esc(v.m)}</span></label></li>`; }).join('');
  html += `<section class="spread">
    <div class="page en">
      <div class="runhead">${esc(m.series_en)} <button class="track" data-s="${si}"><i>▶</i>Track ${esc(m.track)}</button></div>
      ${first ? `<h1>${esc(m.title_en)}</h1><h2 class="sub">${esc(m.subtitle_en)}</h2><p class="source">${esc(m.source_en)}</p>` : ''}
      ${s.heading_en ? `<h3>${esc(s.heading_en)}</h3>` : ''}
      <div class="body">${enP}</div>

    <div class="page ja">

      ${first ? `<h1>${esc(m.title_ja)}</h1><h2 class="sub">${esc(m.subtitle_ja)}</h2><p class="source">${esc(m.date_ja)}</p>` : ''}
      ${s.heading_ja ? `<h3>${esc(s.heading_ja)}</h3>` : ''}
      <div class="body">${jaP}</div>
      <div class="words"><div class="band">Words and Phrases</div><ul>${vocab}</ul></div>
      <span class="folio">${page + 1}</span>
    </div></section>`;
  page += 2;
});
$('#book').innerHTML = html;

const au = $('#au');
// 音声を丸ごと読み込んでから再生する（Range 非対応のサーバーでもシークできるように）
fetch(D.audio).then(r => { if (!r.ok) throw 0; return r.blob(); })
  .then(b => au.src = URL.createObjectURL(b)).catch(() => au.src = D.audio);
const T = D.timings, fmt = t => `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
let loop = false, cur = -1;
const idxAt = t => { for (let i = T.length - 1; i >= 0; i--) if (t >= T[i][0] - 0.05) return i; return 0; };
const seekTo = i => { i = Math.max(0, Math.min(T.length - 1, i)); au.currentTime = T[i][0]; mark(i); au.play(); };
function mark(i){
  if (i === cur) return; cur = i;
  document.querySelectorAll('.para.on').forEach(e => e.classList.remove('on'));
  document.querySelectorAll(`.para[data-i="${i}"]`).forEach(e => e.classList.add('on'));
  const el = document.querySelector(`.en .para[data-i="${i}"]`);
  if (el && !au.paused) { const r = el.getBoundingClientRect(); if (r.top < 60 || r.bottom > innerHeight - 110) el.scrollIntoView({behavior:'smooth', block:'center'}); }
}
au.addEventListener('loadedmetadata', () => $('#dur').textContent = fmt(au.duration));
au.addEventListener('timeupdate', () => {
  const t = au.currentTime;
  if (loop && cur >= 0 && t >= T[cur][1] + 0.4) { au.currentTime = T[cur][0]; return; }
  mark(idxAt(t));
  $('#cur').textContent = fmt(t);
  if (au.duration) $('#pos').value = t / au.duration * 1000;
});
au.addEventListener('play', () => $('#play').textContent = '❚❚');
au.addEventListener('pause', () => $('#play').textContent = '▶');
$('#play').onclick = () => au.paused ? au.play() : au.pause();
$('#prev').onclick = () => seekTo((cur < 0 ? 0 : cur) - 1);
$('#next').onclick = () => seekTo(cur + 1);
$('#pos').oninput = e => { if (au.duration) au.currentTime = e.target.value / 1000 * au.duration; };
$('#rate').onchange = e => au.playbackRate = +e.target.value;
const tog = (id, fn) => $(id).onclick = e => { e.currentTarget.classList.toggle('on'); fn(e.currentTarget.classList.contains('on')); };
tog('#loop', v => loop = v);
tog('#hideEn', v => document.body.classList.toggle('hide-en', v));
tog('#hideJa', v => document.body.classList.toggle('hide-ja', v));
document.addEventListener('click', e => {
  const p = e.target.closest('.para'); if (p) return seekTo(+p.dataset.i);
  const t = e.target.closest('.track'); if (t) { const s = +t.dataset.s; let i = 0; for (let k = 0; k < s; k++) i += D.sections[k].paragraphs.length; seekTo(i); }
});
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.k; if (k) { checked[k] = e.target.checked; store.set(KEY, checked); } });
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); $('#play').click(); }
  if (e.code === 'ArrowRight') seekTo(cur + 1); if (e.code === 'ArrowLeft') seekTo(cur - 1); });
</script>
</body>
</html>
