<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fed is set to raise rates again, and Japan will feel the shock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#e9e6df; --paper:#fbfaf6; --ink:#1d1d1b; --muted:#6b6a65; --rule:#2b2b2b;
  --band:#8a8a88; --band-ink:#fff; --hl:#fff2b3; --hl-line:#e0b400; --gutter:rgba(0,0,0,.10);
  --bar:#1f1f1e; --bar-ink:#f4f3ef; --accent:#c8a200;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#151514; --paper:#22221f; --ink:#e9e7e1; --muted:#a3a19a; --rule:#cfcdc6;
    --band:#5c5c59; --band-ink:#fff; --hl:#4a4120; --hl-line:#d8b42a; --gutter:rgba(0,0,0,.45);
    --bar:#0d0d0c; --bar-ink:#f4f3ef;
  }
}
:root[data-theme="dark"]{
  --desk:#151514; --paper:#22221f; --ink:#e9e7e1; --muted:#a3a19a; --rule:#cfcdc6;
  --band:#5c5c59; --band-ink:#fff; --hl:#4a4120; --hl-line:#d8b42a; --gutter:rgba(0,0,0,.45);
  --bar:#0d0d0c; --bar-ink:#f4f3ef;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;padding:24px 16px 120px}
.spread{max-width:1240px;margin:0 auto 32px;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.10);border-radius:4px;position:relative}
.spread::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:36px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,var(--gutter) 50%,transparent);pointer-events:none}
.page{padding:44px 52px 56px;position:relative;min-height:640px;display:flex;flex-direction:column}
.runhead{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.02em;color:var(--ink);margin-bottom:28px}
.runhead::after{content:"";flex:1;border-top:1px solid var(--rule)}
.page.ja .runhead{flex-direction:row-reverse}
.track{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;cursor:pointer;border:0;background:none;color:inherit;padding:0}
.track i{width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:9px}
h1{font-family:"Source Serif 4",Georgia,serif;font-size:30px;line-height:1.15;margin:0 0 6px;font-weight:700}
h2.sub{font-family:"Source Serif 4",Georgia,serif;font-size:19px;line-height:1.3;margin:0 0 14px;font-weight:700}
.page.ja h1{font-family:"Noto Serif JP",serif;font-size:24px;line-height:1.45;font-weight:700;margin-bottom:2px}
.page.ja h2.sub{font-family:"Noto Serif JP",serif;font-size:18px;font-weight:700}
.source{text-align:right;font-size:12px;color:var(--muted);margin:0 0 22px}
.source::before{content:"● "}
h3{font-family:"Source Serif 4",Georgia,serif;font-size:17px;margin:4px 0 8px;font-weight:700}
.page.ja h3{font-family:"Noto Sans JP",sans-serif;font-size:15px}
.en p{font-family:"Source Serif 4",Georgia,serif;font-size:18px;line-height:1.72;margin:0;text-indent:1.4em;text-align:justify;hyphens:auto}
.ja p{font-family:"Noto Serif JP",serif;font-size:15px;line-height:2.0;margin:0;text-indent:1em;text-align:justify}
.para{cursor:pointer;border-radius:3px;transition:background .2s;padding:1px 4px;margin:0 -4px}
.para:hover{background:color-mix(in srgb,var(--hl) 45%,transparent)}
.para.on{background:var(--hl);box-shadow:inset 3px 0 0 var(--hl-line)}
body.hide-en .en .body{filter:blur(6px);user-select:none}
body.hide-en .en .para.on{filter:none}
body.hide-ja .ja .body{filter:blur(5px)}
.words{margin-top:auto;padding-top:28px}
.words .band{background:var(--band);color:var(--band-ink);font-weight:700;font-size:14px;padding:5px 14px;border-radius:999px 999px 0 0;width:92%}
.words ul{list-style:none;margin:0;padding:10px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:4px 14px;font-size:13px}
.words li{display:flex;gap:6px;align-items:baseline}
.words label{display:block;cursor:pointer;padding-left:20px;text-indent:-20px;line-height:1.5}
.words input{margin:0 6px 0 0;vertical-align:-1px;accent-color:var(--accent)}
.words b{font-family:"Source Serif 4",Georgia,serif;font-weight:400;font-size:14px;margin-right:6px}
.words span{color:var(--muted)}
.folio{position:absolute;bottom:18px;font-size:13px;color:var(--muted)}
.en .folio{left:52px}.ja .folio{right:52px}
/* player */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);color:var(--bar-ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:10}
.bar .in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.bar button,.bar select{font:inherit;font-size:13px;color:inherit;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:6px 10px;cursor:pointer}
.bar button.on{background:var(--accent);border-color:var(--accent);color:#111}
.bar .play{width:44px;height:36px;font-size:16px}
.seek{flex:1;min-width:160px;display:flex;align-items:center;gap:8px;font-size:12px;font-variant-numeric:tabular-nums}
.seek input{flex:1;accent-color:var(--accent)}
@media (max-width:860px){
  .spread{grid-template-columns:1fr}
  .spread::after{display:none}
  .page{padding:28px 18px 48px;min-height:0}
  .page.ja{border-top:1px dashed var(--gutter)}
  h1{font-size:25px}
  .en p{font-size:17px}
  .folio{display:none}
  body{padding:12px 0 150px}
  .spread{border-radius:0}
}
@media print{
  body{background:#fff;padding:0}
  .bar{display:none}
  .spread{box-shadow:none;break-after:page;margin:0;max-width:none}
  .para.on{background:none;box-shadow:none}
  body.hide-en .en .body,body.hide-ja .ja .body{filter:none}
  @page{size:A4 landscape;margin:10mm}
}
</style>
</head>

<script>
const D = {"meta": {"series_en": "Economy & Business 3", "series_ja": "経済・ビジネス 3", "track": "19", "title_en": "The Fed is set to raise rates again, and Japan will feel the shock", "subtitle_en": "With inflation spreading and officials divided, Washington should act steadily and explain clearly, while Tokyo protects households and keeps its budget credible", "title_ja": "米利上げ再び、その衝撃は日本にも及ぶ", "subtitle_ja": "インフレが広がり当局者の意見も割れる中、米国は着実に動き明確に説明すべきだ。日本は家計を守り、財政の信認を保たねばならない", "source_en": "Original text based on reports from AP, TheStreet, Motley Fool and Yahoo Finance, Nov. 2026", "date_ja": "2026年11月24日作成", "start_page": 14, "voice": "Samantha", "rate": 145, "pause_sec": 1.0, "engine": "openai", "openai_voice": "cedar"}, "sections": [{"heading_en": "", "heading_ja": "", "paragraphs": [{"en": "America's central bank is about to do something that markets, borrowers and foreign governments hoped they would not see again soon. After raising its key rate in September for the first time in three years, the Federal Reserve is now widely expected to raise it again next month.", "ja": "米連邦準備制度理事会は、市場も借り手も外国政府も当面は見たくないと願ってきたことをしようとしている。9月に3年ぶりの利上げに踏み切った同理事会は、来月再び利上げすると広く予想されている。"}, {"en": "Minutes of the October meeting, released this week, showed that nearly every official expects a quarter point increase at the December gathering. Futures markets agree. Traders now put the odds of a hike at around ninety percent, and some days at nearly one hundred.", "ja": "今週公表された10月会合の議事要旨は、ほぼ全ての当局者が12月会合での0.25ポイントの利上げを見込んでいることを示した。先物市場も同じ見方だ。トレーダーは利上げの確率を約9割、日によってはほぼ10割と見ている。"}, {"en": "The reason is simple. Inflation has picked up again this autumn, and it is no longer limited to energy and goods hit by tariffs. Governor Christopher Waller said core prices have been rising at an annual pace of about three and a half percent, far above the two percent target.", "ja": "理由は単純だ。インフレは今秋再び加速し、もはやエネルギーや関税の影響を受けた品目に限られない。クリストファー・ウォラー理事は、変動の大きい品目を除く物価が年率約3.5％で上昇していると述べた。目標の2％を大きく上回る。"}, {"en": "Waller went further than most of his colleagues. He argued for a half point increase in December and warned that several hikes, not just two, may be needed. Inflation, he said, is heading in the wrong direction, and waiting would only make the cure more painful.", "ja": "ウォラー氏は同僚の大半よりさらに踏み込んだ。12月に0.5ポイントの利上げを行うべきだと主張し、2回ではなく数回の利上げが必要になるかもしれないと警告した。インフレは誤った方向に向かっており、待てば治療はいっそう痛みを伴うと語った。"}], "vocab": [{"w": "key rate", "m": "政策金利"}, {"w": "minutes", "m": "議事要旨"}, {"w": "quarter point", "m": "0.25ポイント"}, {"w": "core prices", "m": "コア物価"}, {"w": "annual pace", "m": "年率ペース"}, {"w": "pick up", "m": "加速する"}, {"w": "head in the wrong direction", "m": "誤った方向に向かう"}, {"w": "hike", "m": "利上げ(する)"}]}, {"heading_en": "A Divided Committee", "heading_ja": "割れる委員会", "paragraphs": [{"en": "Not everyone agrees. John Williams, who leads the New York Fed, said the situation does not call for dramatic action, and he opposed the larger step. Yet even the cautious camp accepts that rates are heading up. The argument is about speed, not direction.", "ja": "全員が同意しているわけではない。ニューヨーク連銀のジョン・ウィリアムズ総裁は、状況は劇的な対応を求めてはいないとして、大幅な利上げに反対した。だが慎重派でさえ、金利が上がる方向にあることは認めている。争点は方向ではなく速度である。"}, {"en": "Two members, Lisa Cook and Beth Hammack, formally dissented in October because they wanted higher rates right away. Alberto Musalem of the St. Louis Fed even predicted several increases before spring. A committee that once debated cuts now debates how hard to press the brake.", "ja": "リサ・クック氏とベス・ハマック氏の2人は、直ちに金利を引き上げたいとして10月に正式に反対票を投じた。セントルイス連銀のアルベルト・ムサレム氏は、春までに複数回の利上げがあると予測さえした。かつて利下げを議論した委員会が、今はブレーキをどれだけ強く踏むかを議論している。"}, {"en": "The chair, Kevin Warsh, offered little help. Asked about the next move, he said he does not believe in forward guidance except in a crisis, and he would not prejudge any meeting. That is a principled position, but it leaves investors guessing while the stakes keep rising.", "ja": "議長のケビン・ウォーシュ氏はほとんど手がかりを与えなかった。次の一手を問われると、危機でもない限り先行きの指針は示さない立場であり、会合の結論を前もって決めつけることもしないと答えた。筋の通った姿勢だが、利害が膨らむ中で投資家は推測を強いられる。"}, {"en": "There is a case for that restraint. Central bankers who promise too much can be trapped by their own words. But silence has a price as well. When officials disagree in public and the chair stays quiet, markets tend to swing wildly on every speech and every data release.", "ja": "その慎重さには一理ある。約束しすぎる中央銀行幹部は、自らの言葉に縛られかねない。しかし沈黙にも代償がある。当局者が公然と意見を違え、議長が口を閉ざせば、市場は演説や経済指標のたびに大きく揺れやすくなる。"}], "vocab": [{"w": "call for", "m": "～を必要とする"}, {"w": "dissent", "m": "反対意見を述べる"}, {"w": "camp", "m": "陣営"}, {"w": "press the brake", "m": "ブレーキを踏む"}, {"w": "forward guidance", "m": "先行きの指針"}, {"w": "prejudge", "m": "前もって判断する"}, {"w": "restraint", "m": "自制、慎重さ"}, {"w": "swing wildly", "m": "激しく変動する"}]}, {"heading_en": "The Cost for Households", "heading_ja": "家計への代償", "paragraphs": [{"en": "Ordinary Americans are already feeling the squeeze. Mortgage rates have climbed above seven percent in recent months, and home sales have withered. Young families who hoped to buy a first house are putting their plans on hold, and many owners are staying put rather than give up cheap old loans.", "ja": "普通の米国民はすでに締め付けを感じている。住宅ローン金利はここ数か月で7％を超え、住宅販売は冷え込んだ。初めての家の購入を望んでいた若い家族は計画を先送りし、多くの所有者は低利の古いローンを手放したくないため動かずにいる。"}, {"en": "Stock investors are nervous too. Technology shares, which carried the market for much of the year, have wobbled as expensive artificial intelligence bets look less attractive when borrowing costs rise. Higher rates make future profits worth less today, and that arithmetic is unforgiving for richly valued companies.", "ja": "株式投資家も神経質になっている。今年の相場の多くを牽引してきたハイテク株は揺らいでいる。借り入れコストが上がると、高価な人工知能への賭けは魅力が薄れるからだ。金利が上がれば将来の利益の現在価値は下がり、その計算は割高な企業に容赦がない。"}, {"en": "The ripple effects will cross the Pacific. A higher American rate usually pulls money toward the dollar and weakens the yen, which raises the cost of imported fuel and food in Japan. Households here, already struggling with rising prices, would feel the pain a second time.", "ja": "波及効果は太平洋を越える。米国の金利上昇は通常、ドルへの資金流入を促して円を弱くし、日本の輸入燃料や食料品のコストを押し上げる。すでに物価高に苦しむ日本の家計は、二度目の痛みを味わうことになる。"}, {"en": "That puts the Bank of Japan in a difficult position. It raised its own rate in September to the highest level in decades, yet the gap with America remains wide. If the yen slides further, pressure for another increase will grow, even though a fragile economy needs support, not strain.", "ja": "これは日本銀行を難しい立場に置く。日銀は9月に政策金利を数十年ぶりの高水準まで引き上げたが、米国との金利差は依然として大きい。円がさらに下落すれば、脆弱な経済に必要なのは重荷ではなく支えであるにもかかわらず、追加利上げを求める圧力は強まるだろう。"}], "vocab": [{"w": "feel the squeeze", "m": "締め付けを感じる"}, {"w": "wither", "m": "冷え込む、しぼむ"}, {"w": "put on hold", "m": "保留にする"}, {"w": "wobble", "m": "揺らぐ"}, {"w": "borrowing costs", "m": "借り入れコスト"}, {"w": "richly valued", "m": "割高な"}, {"w": "ripple effects", "m": "波及効果"}, {"w": "slide", "m": "下落する"}]}, {"heading_en": "What Policymakers Should Do", "heading_ja": "政策当局者がなすべきこと", "paragraphs": [{"en": "The Fed has little choice but to act. Letting inflation settle in at three percent or more would erode savings, hurt workers on fixed incomes and force a harsher correction later. A steady quarter point move in December is the prudent course, and a larger one should be kept in reserve.", "ja": "連邦準備制度には行動する以外の選択肢がほとんどない。インフレが3％以上で定着するのを許せば、貯蓄は目減りし、固定収入の労働者は打撃を受け、後にいっそう厳しい調整を強いられる。12月に着実な0.25ポイントの利上げを行うのが賢明であり、それより大きな措置は温存すべきだ。"}, {"en": "What the Fed owes the world is clarity. It need not promise a path, but it should explain how it reads the data and what would change its mind. Plain language, repeated often, calms markets far better than studied silence, especially when its own members disagree so openly.", "ja": "連邦準備制度が世界に負っているのは明確さである。道筋を約束する必要はないが、データをどう読み、何があれば考えを変えるのかを説明すべきだ。特に内部の意見がこれほど公然と割れているときには、平易な言葉を繰り返し語るほうが、計算された沈黙よりはるかに市場を落ち着かせる。"}, {"en": "Tokyo has its own homework. The government should resist the temptation to blame every price rise on the yen and instead protect the most vulnerable households with targeted help. At the same time, it must keep its budget credible, because bond markets here are already watching it closely.", "ja": "東京にも宿題がある。政府は物価上昇の原因を何でも円安のせいにする誘惑に抵抗し、代わりに最も弱い立場の世帯を的を絞った支援で守るべきだ。同時に、日本の債券市場がすでに財政を注視している以上、予算の信認も保たなければならない。"}], "vocab": [{"w": "have little choice but to", "m": "～するほかない"}, {"w": "settle in", "m": "定着する"}, {"w": "erode", "m": "むししばむ、目減りさせる"}, {"w": "prudent", "m": "賢明な"}, {"w": "erode", "m": "蝕む、目減りさせる"}, {"w": "owe", "m": "～を負っている"}, {"w": "targeted help", "m": "的を絞った支援"}, {"w": "credible", "m": "信頼できる"}]}], "timings": [[0.0, 15.36], [16.36, 32.73], [33.73, 47.38], [48.38, 64.58], [65.58, 81.83], [82.83, 100.23], [101.23, 116.64], [117.64, 135.04], [136.04, 152.7], [153.7, 173.86], [174.86, 190.72], [191.72, 208.33], [209.33, 225.43], [226.43, 242.9], [243.9, 260.5]], "audio": "audio.m4a"};
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
const KEY = 'shadow:' + D.meta.title_en;
const checked = store.get(KEY) || {};
const m = D.meta;
let pi = 0, page = m.start_page || 1, html = '';
D.sections.forEach((s, si) => {

    return `<li><label><input type="checkbox" data-k="${id}" ${checked[id]?'checked':''}><b>${esc(v.w)}</b><span>${esc(v.m)}</span></label></li>`; }).join('');
  html += `<section class="spread">

});
$('#book').innerHTML = html;

const au = $('#au');
// 音声を丸ごと読み込んでから再生する（Range 非対応のサーバーでもシークできるように）
fetch(D.audio).then(r => { if (!r.ok) throw 0; return r.blob(); })
  .then(b => au.src = URL.createObjectURL(b)).catch(() => au.src = D.audio);
const T = D.timings, fmt = t => `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
let loop = false, cur = -1;
const idxAt = t => { for (let i = T.length - 1; i >= 0; i--) if (t >= T[i][0] - 0.05) return i; return 0; };
const seekTo = i => { i = Math.max(0, Math.min(T.length - 1, i)); au.currentTime = T[i][0]; mark(i); au.play(); };
function mark(i){
  if (i === cur) return; cur = i;
  document.querySelectorAll('.para.on').forEach(e => e.classList.remove('on'));
  document.querySelectorAll(`.para[data-i="${i}"]`).forEach(e => e.classList.add('on'));
  const el = document.querySelector(`.en .para[data-i="${i}"]`);
  if (el && !au.paused) { const r = el.getBoundingClientRect(); if (r.top < 60 || r.bottom > innerHeight - 110) el.scrollIntoView({behavior:'smooth', block:'center'}); }
}
au.addEventListener('loadedmetadata', () => $('#dur').textContent = fmt(au.duration));
au.addEventListener('timeupdate', () => {
  const t = au.currentTime;
  if (loop && cur >= 0 && t >= T[cur][1] + 0.4) { au.currentTime = T[cur][0]; return; }
  mark(idxAt(t));
  $('#cur').textContent = fmt(t);
  if (au.duration) $('#pos').value = t / au.duration * 1000;
});
au.addEventListener('play', () => $('#play').textContent = '❚❚');
au.addEventListener('pause', () => $('#play').textContent = '▶');
$('#play').onclick = () => au.paused ? au.play() : au.pause();
$('#prev').onclick = () => seekTo((cur < 0 ? 0 : cur) - 1);
$('#next').onclick = () => seekTo(cur + 1);
$('#pos').oninput = e => { if (au.duration) au.currentTime = e.target.value / 1000 * au.duration; };
$('#rate').onchange = e => au.playbackRate = +e.target.value;
const tog = (id, fn) => $(id).onclick = e => { e.currentTarget.classList.toggle('on'); fn(e.currentTarget.classList.contains('on')); };
tog('#loop', v => loop = v);
tog('#hideEn', v => document.body.classList.toggle('hide-en', v));
tog('#hideJa', v => document.body.classList.toggle('hide-ja', v));
document.addEventListener('click', e => {
  const p = e.target.closest('.para'); if (p) return seekTo(+p.dataset.i);
  const t = e.target.closest('.track'); if (t) { const s = +t.dataset.s; let i = 0; for (let k = 0; k < s; k++) i += D.sections[k].paragraphs.length; seekTo(i); }
});
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.k; if (k) { checked[k] = e.target.checked; store.set(KEY, checked); } });
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); $('#play').click(); }
  if (e.code === 'ArrowRight') seekTo(cur + 1); if (e.code === 'ArrowLeft') seekTo(cur - 1); });
</script>
</body>
</html>
