<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japan's births tick up for the first time in eleven years, and the window must not close</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#e9e6df; --paper:#fbfaf6; --ink:#1d1d1b; --muted:#6b6a65; --rule:#2b2b2b;
  --band:#8a8a88; --band-ink:#fff; --hl:#fff2b3; --hl-line:#e0b400; --gutter:rgba(0,0,0,.10);
  --bar:#1f1f1e; --bar-ink:#f4f3ef; --accent:#c8a200;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#151514; --paper:#22221f; --ink:#e9e7e1; --muted:#a3a19a; --rule:#cfcdc6;
    --band:#5c5c59; --band-ink:#fff; --hl:#4a4120; --hl-line:#d8b42a; --gutter:rgba(0,0,0,.45);
    --bar:#0d0d0c; --bar-ink:#f4f3ef;
  }
}
:root[data-theme="dark"]{
  --desk:#151514; --paper:#22221f; --ink:#e9e7e1; --muted:#a3a19a; --rule:#cfcdc6;
  --band:#5c5c59; --band-ink:#fff; --hl:#4a4120; --hl-line:#d8b42a; --gutter:rgba(0,0,0,.45);
  --bar:#0d0d0c; --bar-ink:#f4f3ef;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;padding:24px 16px 120px}
.spread{max-width:1240px;margin:0 auto 32px;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.10);border-radius:4px;position:relative}
.spread::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:36px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,var(--gutter) 50%,transparent);pointer-events:none}
.page{padding:44px 52px 56px;position:relative;min-height:640px;display:flex;flex-direction:column}
.runhead{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.02em;color:var(--ink);margin-bottom:28px}
.runhead::after{content:"";flex:1;border-top:1px solid var(--rule)}
.page.ja .runhead{flex-direction:row-reverse}
.track{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;cursor:pointer;border:0;background:none;color:inherit;padding:0}
.track i{width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:9px}
h1{font-family:"Source Serif 4",Georgia,serif;font-size:30px;line-height:1.15;margin:0 0 6px;font-weight:700}
h2.sub{font-family:"Source Serif 4",Georgia,serif;font-size:19px;line-height:1.3;margin:0 0 14px;font-weight:700}
.page.ja h1{font-family:"Noto Serif JP",serif;font-size:24px;line-height:1.45;font-weight:700;margin-bottom:2px}
.page.ja h2.sub{font-family:"Noto Serif JP",serif;font-size:18px;font-weight:700}
.source{text-align:right;font-size:12px;color:var(--muted);margin:0 0 22px}
.source::before{content:"● "}
h3{font-family:"Source Serif 4",Georgia,serif;font-size:17px;margin:4px 0 8px;font-weight:700}
.page.ja h3{font-family:"Noto Sans JP",sans-serif;font-size:15px}
.en p{font-family:"Source Serif 4",Georgia,serif;font-size:18px;line-height:1.72;margin:0;text-indent:1.4em;text-align:justify;hyphens:auto}
.ja p{font-family:"Noto Serif JP",serif;font-size:15px;line-height:2.0;margin:0;text-indent:1em;text-align:justify}
.para{cursor:pointer;border-radius:3px;transition:background .2s;padding:1px 4px;margin:0 -4px}
.para:hover{background:color-mix(in srgb,var(--hl) 45%,transparent)}
.para.on{background:var(--hl);box-shadow:inset 3px 0 0 var(--hl-line)}
body.hide-en .en .body{filter:blur(6px);user-select:none}
body.hide-en .en .para.on{filter:none}
body.hide-ja .ja .body{filter:blur(5px)}
.words{margin-top:auto;padding-top:28px}
.words .band{background:var(--band);color:var(--band-ink);font-weight:700;font-size:14px;padding:5px 14px;border-radius:999px 999px 0 0;width:92%}
.words ul{list-style:none;margin:0;padding:10px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:4px 14px;font-size:13px}
.words li{display:flex;gap:6px;align-items:baseline}
.words label{display:block;cursor:pointer;padding-left:20px;text-indent:-20px;line-height:1.5}
.words input{margin:0 6px 0 0;vertical-align:-1px;accent-color:var(--accent)}
.words b{font-family:"Source Serif 4",Georgia,serif;font-weight:400;font-size:14px;margin-right:6px}
.words span{color:var(--muted)}
.folio{position:absolute;bottom:18px;font-size:13px;color:var(--muted)}
.en .folio{left:52px}.ja .folio{right:52px}
/* player */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);color:var(--bar-ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:10}
.bar .in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.bar button,.bar select{font:inherit;font-size:13px;color:inherit;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:6px 10px;cursor:pointer}
.bar button.on{background:var(--accent);border-color:var(--accent);color:#111}
.bar .play{width:44px;height:36px;font-size:16px}
.seek{flex:1;min-width:160px;display:flex;align-items:center;gap:8px;font-size:12px;font-variant-numeric:tabular-nums}
.seek input{flex:1;accent-color:var(--accent)}
@media (max-width:860px){
  .spread{grid-template-columns:1fr}
  .spread::after{display:none}
  .page{padding:28px 18px 48px;min-height:0}
  .page.ja{border-top:1px dashed var(--gutter)}
  h1{font-size:25px}
  .en p{font-size:17px}
  .folio{display:none}
  body{padding:12px 0 150px}
  .spread{border-radius:0}
}
@media print{
  body{background:#fff;padding:0}
  .bar{display:none}
  .spread{box-shadow:none;break-after:page;margin:0;max-width:none}
  .para.on{background:none;box-shadow:none}
  body.hide-en .en .body,body.hide-ja .ja .body{filter:none}
  @page{size:A4 landscape;margin:10mm}
}
</style>
</head>

<script>
const D = {"meta": {"series_en": "Society & Culture 1", "series_ja": "社会・文化 1", "track": "08", "title_en": "Japan's births tick up for the first time in eleven years, and the window must not close", "subtitle_en": "A small rise offers time to fix pay, housing and work, not a reason to relax", "title_ja": "出生数、11年ぶり増加　この好機を逃してはならない", "subtitle_ja": "わずかな増加は、賃金・住宅・働き方を改める時間を与えるもので、安心の理由ではない", "source_en": "Original text based on reports from Nippon.com, Jiji Press, Yomiuri Shimbun and Asia News Network, Nov. 2026", "date_ja": "2026年11月13日作成", "start_page": 14, "voice": "Samantha", "rate": 145, "pause_sec": 1.0, "engine": "openai", "openai_voice": "cedar"}, "sections": [{"heading_en": "", "heading_ja": "", "paragraphs": [{"en": "Japan has received a rare piece of encouraging demographic news. Revised government figures show that the number of babies born to Japanese citizens in the first half of this year rose for the first time in eleven years. The increase is small, but it deserves attention after a decade of steady decline.", "ja": "日本に、人口動態をめぐる珍しい明るい知らせが届いた。政府の確定値によると、今年上半期に生まれた日本人の赤ちゃんの数が11年ぶりに増えた。増加はわずかだが、10年にわたる着実な減少の後だけに注目に値する。"}, {"en": "The health ministry counted about three hundred twenty thousand births between January and June, roughly fourteen hundred more than a year earlier. That is a gain of just under half a percent. Marriages also edged up slightly. Deaths, meanwhile, fell, which narrowed the natural population decline.", "ja": "厚生労働省の集計では、1月から6月の出生数は約32万人で、前年同期より約1400人多かった。伸びは0.5％弱である。婚姻数もわずかに増えた。一方、死亡数は減り、自然減の幅は縮まった。"}, {"en": "Context matters, however. Annual births dropped below eight hundred thousand in 2022 and below seven hundred thousand in 2024. Last year the total reached a record low for the tenth consecutive year. Against that backdrop, a rise of even a few thousand babies feels like a pause in a long fall.", "ja": "ただし、背景を見る必要がある。年間の出生数は2022年に80万人を、2024年には70万人を割り込んだ。昨年の総数は10年連続で過去最少となった。それを考えれば、数千人の増加でも、長い下落の途中の小休止に見える。"}, {"en": "Officials and analysts are cautious, and rightly so. One good half year does not make a trend. Still, the figures offer a moment to ask what is working, and what is not, in a country whose shrinking population threatens its economy, its schools, and its pension system.", "ja": "当局者も専門家も慎重で、それは正しい。好調な半年が一度あっても傾向とは言えない。それでも、この数字は、人口減が経済、学校、年金制度を脅かす国で、何が効き、何が効いていないのかを問う好機である。"}], "vocab": [{"w": "demographic", "m": "人口動態の"}, {"w": "revised figures", "m": "確定値、改定値"}, {"w": "deserve attention", "m": "注目に値する"}, {"w": "steady decline", "m": "着実な減少"}, {"w": "edge up", "m": "わずかに上がる"}, {"w": "narrow", "m": "狭める"}, {"w": "consecutive", "m": "連続した"}, {"w": "backdrop", "m": "背景"}, {"w": "rightly so", "m": "当然のことだが"}, {"w": "shrinking", "m": "縮小する"}, {"w": "pension system", "m": "年金制度"}]}, {"heading_en": "Why the numbers moved", "heading_ja": "数字はなぜ動いたか", "paragraphs": [{"en": "The most likely explanation lies in marriage. Many couples delayed weddings during the pandemic and then married in larger numbers in 2024 and 2025. Because most births in Japan occur within marriage, a wave of weddings tends to be followed, a year or two later, by a wave of newborns.", "ja": "最も有力な説明は婚姻にある。多くのカップルがパンデミック中に結婚を延期し、2024年と2025年にまとまって結婚した。日本では出生の大半が婚姻内で起こるため、結婚が増えると、1、2年後に出生も増えやすい。"}, {"en": "Tokyo stands out. The number of Japanese children born there in the first half rose by almost five percent, far above the national pace. The capital has expanded subsidies for child care, free school meals, and support for people seeking partners, and officials are eager to credit those measures.", "ja": "東京は際立っている。上半期に生まれた日本人の子どもは5％近く増え、全国の伸びをはるかに上回った。都は保育の補助、給食の無償化、結婚を望む人への支援を拡充しており、担当者はそうした施策の成果だと強調したがっている。"}, {"en": "Credit may be partly deserved, but caution is needed. Tokyo attracts young adults from across the country, so more births there can reflect migration rather than a genuine rise in family size. If young people move to the capital and then cannot afford larger homes, the benefit may fade quickly.", "ja": "成果は一部認められるかもしれないが、慎重さが要る。東京は全国から若者を引き寄せるため、出生の増加は、家族の規模が本当に増えたというより人の移動を反映している可能性がある。若者が上京しても広い家を買えなければ、効果は急速に薄れかねない。"}, {"en": "Another reminder is that the total fertility rate remains at an extremely low level, near one point one. Even if more couples marry, each family is having fewer children than in the past. Counting weddings alone, in other words, tells only half of the story.", "ja": "もう一つ忘れてはならないのは、合計特殊出生率が1.1前後と極めて低いままだということだ。結婚するカップルが増えても、一家族あたりの子どもの数は昔より少ない。つまり、結婚の数だけでは話の半分しか分からない。"}], "vocab": [{"w": "pandemic", "m": "世界的大流行"}, {"w": "delay", "m": "先延ばしにする"}, {"w": "occur", "m": "起こる"}, {"w": "a wave of", "m": "〜の波"}, {"w": "stand out", "m": "際立つ"}, {"w": "subsidy", "m": "補助金"}, {"w": "be eager to", "m": "〜したがる"}, {"w": "credit", "m": "〜の手柄とする"}, {"w": "migration", "m": "人口移動"}, {"w": "genuine", "m": "本物の"}, {"w": "fade", "m": "薄れる"}, {"w": "total fertility rate", "m": "合計特殊出生率"}]}, {"heading_en": "Barriers young families face", "heading_ja": "若い家族の前にある壁", "paragraphs": [{"en": "Surveys repeatedly show that young Japanese want to marry and have children, yet many hold back for financial reasons. Wages have grown slowly, housing in cities is costly, and unstable contracts make long-term planning difficult. The gap between hopes and reality is the central challenge for any population policy.", "ja": "調査では、若い日本人が結婚や子育てを望みながら、経済的な理由で踏みとどまっていることが繰り返し示される。賃金の伸びは鈍く、都市の住宅は高く、不安定な雇用契約が長期の計画を難しくしている。希望と現実の隔たりこそ、あらゆる人口政策の核心的な課題だ。"}, {"en": "Work culture is equally important. Long hours and rigid expectations still fall heavily on women, who often carry most housework and child care. Companies that allow flexible schedules and encourage fathers to take leave are not merely being generous. They are helping to remove a real obstacle to having children.", "ja": "職場文化も同じく重要だ。長時間労働や硬直した期待は今も女性に重くのしかかり、女性が家事や育児の大半を担うことが多い。柔軟な勤務を認め、父親の育休取得を促す企業は、単に寛大なのではない。子どもを持つうえでの現実の障害を取り除いているのだ。"}, {"en": "Local governments have been experimenting with cash payments, free medical care for children, and matchmaking programs. Some results are encouraging, and several prefectures recently reported higher fertility. Yet scattered programs create an uneven map, in which a family's support depends on the town where it happens to live.", "ja": "自治体は、現金給付、子どもの医療費無償化、結婚支援事業などを試してきた。成果が出ている例もあり、最近は複数の県で出生率が上がったと報告された。だが施策が散在すれば地図は不均一になり、家族が受ける支援は、たまたま住んでいる町次第になる。"}, {"en": "The national government should therefore learn from these experiments and spread the best ones. Reliable funding is essential. Short-term campaigns launched with great fanfare and quietly dropped later will not persuade a twenty-eight-year-old to sign a mortgage or plan a second child.", "ja": "したがって国は、こうした試みから学び、優れたものを広げるべきだ。確かな財源が不可欠である。鳴り物入りで始まり、いつの間にか打ち切られる短期の運動では、28歳の若者に住宅ローンを組ませたり、第二子を考えさせたりすることはできない。"}], "vocab": [{"w": "hold back", "m": "ためらう、控える"}, {"w": "unstable contract", "m": "不安定な雇用契約"}, {"w": "fall heavily on", "m": "〜に重くのしかかる"}, {"w": "rigid", "m": "硬直した"}, {"w": "flexible", "m": "柔軟な"}, {"w": "obstacle", "m": "障害"}, {"w": "matchmaking", "m": "結婚の仲介"}, {"w": "prefecture", "m": "県"}, {"w": "scattered", "m": "散在した"}, {"w": "uneven", "m": "不均一な"}, {"w": "fanfare", "m": "鳴り物入り、華々しい宣伝"}, {"w": "mortgage", "m": "住宅ローン"}]}, {"heading_en": "What Japan should do next", "heading_ja": "日本が次にすべきこと", "paragraphs": [{"en": "Japan should also be honest about immigration. Even a strong recovery in births would not offset the decline of the working-age population within the next few decades. Public opinion has recently grown more skeptical of foreign settlement, but the economy already relies on foreign workers in hospitals, farms, and factories.", "ja": "日本は移民についても率直であるべきだ。出生が力強く回復しても、今後数十年の生産年齢人口の減少は埋め合わせられない。世論は最近、外国人の定住に懐疑的になっているが、経済は病院、農場、工場で既に外国人労働者に頼っている。"}, {"en": "A sensible policy would combine support for families with a clear framework for welcoming newcomers, including language education and fair treatment at work. Treating the two as rivals is a false choice. A society that cares for its own children is more likely to treat newcomers decently as well.", "ja": "賢明な政策は、家族への支援と、言語教育や職場での公正な待遇を含む、新たな住民を受け入れる明確な枠組みを組み合わせるものだ。両者を競合させるのは誤った二者択一である。自国の子どもを大切にする社会は、新しく来た人々にもまともに接する可能性が高い。"}, {"en": "The small rise in births is a gift of time, not a solution. Politicians should use it to build durable policies on pay, housing, and working hours. If they waste it, the next set of figures may revert to decline, and the chance to change course will narrow further.", "ja": "出生のわずかな増加は、解決策ではなく時間の贈り物である。政治家はそれを使い、賃金、住宅、労働時間に関する持続可能な政策を築くべきだ。無駄にすれば、次の数字は再び減少に戻り、進路を変える機会はさらに狭まるだろう。"}], "vocab": [{"w": "offset", "m": "埋め合わせる"}, {"w": "working-age population", "m": "生産年齢人口"}, {"w": "skeptical", "m": "懐疑的な"}, {"w": "settlement", "m": "定住"}, {"w": "rely on", "m": "〜に頼る"}, {"w": "sensible", "m": "賢明な"}, {"w": "framework", "m": "枠組み"}, {"w": "newcomer", "m": "新参者"}, {"w": "false choice", "m": "誤った二者択一"}, {"w": "durable", "m": "持続性のある"}, {"w": "revert to", "m": "〜に逆戻りする"}, {"w": "change course", "m": "進路を変える"}]}], "timings": [[0.0, 19.15], [20.15, 36.21], [37.21, 56.91], [57.91, 74.57], [75.57, 94.82], [95.82, 113.53], [114.53, 132.58], [133.58, 149.44], [150.44, 169.54], [170.54, 188.35], [189.35, 207.62], [208.62, 225.68], [226.68, 247.03], [248.03, 264.95], [265.95, 283.95]], "audio": "audio.m4a"};
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
const KEY = 'shadow:' + D.meta.title_en;
const checked = store.get(KEY) || {};
const m = D.meta;
let pi = 0, page = m.start_page || 1, html = '';
D.sections.forEach((s, si) => {
  const first = si === 0;
  const enP = s.paragraphs.map(p => `<p class="para" data-i="${pi++}">${esc(p.en)}</p>`).join('');
  pi -= s.paragraphs.length;
  const jaP = s.paragraphs.map(p => `<p class="para" data-i="${pi++}">${esc(p.ja)}</p>`).join('');
  const vocab = s.vocab.map((v, vi) => { const id = `v${si}-${vi}`;
    return `<li><label><input type="checkbox" data-k="${id}" ${checked[id]?'checked':''}><b>${esc(v.w)}</b><span>${esc(v.m)}</span></label></li>`; }).join('');
  html += `<section class="spread">
    <div class="page en">
      <div class="runhead">${esc(m.series_en)} <button class="track" data-s="${si}"><i>▶</i>Track ${esc(m.track)}</button></div>
      ${first ? `<h1>${esc(m.title_en)}</h1><h2 class="sub">${esc(m.subtitle_en)}</h2><p class="source">${esc(m.source_en)}</p>` : ''}
      ${s.heading_en ? `<h3>${esc(s.heading_en)}</h3>` : ''}
      <div class="body">${enP}</div>
      <span class="folio">${page}</span>
    </div>
    <div class="page ja">
      <div class="runhead">${esc(m.series_ja)}</div>
      ${first ? `<h1>${esc(m.title_ja)}</h1><h2 class="sub">${esc(m.subtitle_ja)}</h2><p class="source">${esc(m.date_ja)}</p>` : ''}
      ${s.heading_ja ? `<h3>${esc(s.heading_ja)}</h3>` : ''}
      <div class="body">${jaP}</div>
      <div class="words"><div class="band">Words and Phrases</div><ul>${vocab}</ul></div>
      <span class="folio">${page + 1}</span>
    </div></section>`;
  page += 2;
});
$('#book').innerHTML = html;

const au = $('#au');
// 音声を丸ごと読み込んでから再生する（Range 非対応のサーバーでもシークできるように）
fetch(D.audio).then(r => { if (!r.ok) throw 0; return r.blob(); })
  .then(b => au.src = URL.createObjectURL(b)).catch(() => au.src = D.audio);
const T = D.timings, fmt = t => `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
let loop = false, cur = -1;
const idxAt = t => { for (let i = T.length - 1; i >= 0; i--) if (t >= T[i][0] - 0.05) return i; return 0; };
const seekTo = i => { i = Math.max(0, Math.min(T.length - 1, i)); au.currentTime = T[i][0]; mark(i); au.play(); };
function mark(i){
  if (i === cur) return; cur = i;
  document.querySelectorAll('.para.on').forEach(e => e.classList.remove('on'));
  document.querySelectorAll(`.para[data-i="${i}"]`).forEach(e => e.classList.add('on'));
  const el = document.querySelector(`.en .para[data-i="${i}"]`);
  if (el && !au.paused) { const r = el.getBoundingClientRect(); if (r.top < 60 || r.bottom > innerHeight - 110) el.scrollIntoView({behavior:'smooth', block:'center'}); }
}
au.addEventListener('loadedmetadata', () => $('#dur').textContent = fmt(au.duration));
au.addEventListener('timeupdate', () => {
  const t = au.currentTime;
  if (loop && cur >= 0 && t >= T[cur][1] + 0.4) { au.currentTime = T[cur][0]; return; }
  mark(idxAt(t));
  $('#cur').textContent = fmt(t);
  if (au.duration) $('#pos').value = t / au.duration * 1000;
});
au.addEventListener('play', () => $('#play').textContent = '❚❚');
au.addEventListener('pause', () => $('#play').textContent = '▶');
$('#play').onclick = () => au.paused ? au.play() : au.pause();
$('#prev').onclick = () => seekTo((cur < 0 ? 0 : cur) - 1);
$('#next').onclick = () => seekTo(cur + 1);
$('#pos').oninput = e => { if (au.duration) au.currentTime = e.target.value / 1000 * au.duration; };
$('#rate').onchange = e => au.playbackRate = +e.target.value;
const tog = (id, fn) => $(id).onclick = e => { e.currentTarget.classList.toggle('on'); fn(e.currentTarget.classList.contains('on')); };
tog('#loop', v => loop = v);
tog('#hideEn', v => document.body.classList.toggle('hide-en', v));
tog('#hideJa', v => document.body.classList.toggle('hide-ja', v));
document.addEventListener('click', e => {
  const p = e.target.closest('.para'); if (p) return seekTo(+p.dataset.i);
  const t = e.target.closest('.track'); if (t) { const s = +t.dataset.s; let i = 0; for (let k = 0; k < s; k++) i += D.sections[k].paragraphs.length; seekTo(i); }
});
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.k; if (k) { checked[k] = e.target.checked; store.set(KEY, checked); } });
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); $('#play').click(); }
  if (e.code === 'ArrowRight') seekTo(cur + 1); if (e.code === 'ArrowLeft') seekTo(cur - 1); });
</script>
</body>
</html>
