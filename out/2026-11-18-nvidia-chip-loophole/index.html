<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Washington closes the cloud loophole, and Nvidia's turmoil tests its resolve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#e9e6df; --paper:#fbfaf6; --ink:#1d1d1b; --muted:#6b6a65; --rule:#2b2b2b;
  --band:#8a8a88; --band-ink:#fff; --hl:#fff2b3; --hl-line:#e0b400; --gutter:rgba(0,0,0,.10);
  --bar:#1f1f1e; --bar-ink:#f4f3ef; --accent:#c8a200;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#151514; --paper:#22221f; --ink:#e9e7e1; --muted:#a3a19a; --rule:#cfcdc6;
    --band:#5c5c59; --band-ink:#fff; --hl:#4a4120; --hl-line:#d8b42a; --gutter:rgba(0,0,0,.45);
    --bar:#0d0d0c; --bar-ink:#f4f3ef;
  }
}
:root[data-theme="dark"]{
  --desk:#151514; --paper:#22221f; --ink:#e9e7e1; --muted:#a3a19a; --rule:#cfcdc6;
  --band:#5c5c59; --band-ink:#fff; --hl:#4a4120; --hl-line:#d8b42a; --gutter:rgba(0,0,0,.45);
  --bar:#0d0d0c; --bar-ink:#f4f3ef;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;padding:24px 16px 120px}
.spread{max-width:1240px;margin:0 auto 32px;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.10);border-radius:4px;position:relative}
.spread::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:36px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,var(--gutter) 50%,transparent);pointer-events:none}
.page{padding:44px 52px 56px;position:relative;min-height:640px;display:flex;flex-direction:column}
.runhead{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.02em;color:var(--ink);margin-bottom:28px}
.runhead::after{content:"";flex:1;border-top:1px solid var(--rule)}
.page.ja .runhead{flex-direction:row-reverse}
.track{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;cursor:pointer;border:0;background:none;color:inherit;padding:0}
.track i{width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:9px}
h1{font-family:"Source Serif 4",Georgia,serif;font-size:30px;line-height:1.15;margin:0 0 6px;font-weight:700}
h2.sub{font-family:"Source Serif 4",Georgia,serif;font-size:19px;line-height:1.3;margin:0 0 14px;font-weight:700}
.page.ja h1{font-family:"Noto Serif JP",serif;font-size:24px;line-height:1.45;font-weight:700;margin-bottom:2px}
.page.ja h2.sub{font-family:"Noto Serif JP",serif;font-size:18px;font-weight:700}
.source{text-align:right;font-size:12px;color:var(--muted);margin:0 0 22px}
.source::before{content:"● "}
h3{font-family:"Source Serif 4",Georgia,serif;font-size:17px;margin:4px 0 8px;font-weight:700}
.page.ja h3{font-family:"Noto Sans JP",sans-serif;font-size:15px}
.en p{font-family:"Source Serif 4",Georgia,serif;font-size:18px;line-height:1.72;margin:0;text-indent:1.4em;text-align:justify;hyphens:auto}
.ja p{font-family:"Noto Serif JP",serif;font-size:15px;line-height:2.0;margin:0;text-indent:1em;text-align:justify}
.para{cursor:pointer;border-radius:3px;transition:background .2s;padding:1px 4px;margin:0 -4px}
.para:hover{background:color-mix(in srgb,var(--hl) 45%,transparent)}
.para.on{background:var(--hl);box-shadow:inset 3px 0 0 var(--hl-line)}
body.hide-en .en .body{filter:blur(6px);user-select:none}
body.hide-en .en .para.on{filter:none}
body.hide-ja .ja .body{filter:blur(5px)}
.words{margin-top:auto;padding-top:28px}
.words .band{background:var(--band);color:var(--band-ink);font-weight:700;font-size:14px;padding:5px 14px;border-radius:999px 999px 0 0;width:92%}
.words ul{list-style:none;margin:0;padding:10px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:4px 14px;font-size:13px}
.words li{display:flex;gap:6px;align-items:baseline}
.words label{display:block;cursor:pointer;padding-left:20px;text-indent:-20px;line-height:1.5}
.words input{margin:0 6px 0 0;vertical-align:-1px;accent-color:var(--accent)}
.words b{font-family:"Source Serif 4",Georgia,serif;font-weight:400;font-size:14px;margin-right:6px}
.words span{color:var(--muted)}
.folio{position:absolute;bottom:18px;font-size:13px;color:var(--muted)}
.en .folio{left:52px}.ja .folio{right:52px}
/* player */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);color:var(--bar-ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:10}
.bar .in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.bar button,.bar select{font:inherit;font-size:13px;color:inherit;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:6px 10px;cursor:pointer}
.bar button.on{background:var(--accent);border-color:var(--accent);color:#111}
.bar .play{width:44px;height:36px;font-size:16px}
.seek{flex:1;min-width:160px;display:flex;align-items:center;gap:8px;font-size:12px;font-variant-numeric:tabular-nums}
.seek input{flex:1;accent-color:var(--accent)}
@media (max-width:860px){
  .spread{grid-template-columns:1fr}
  .spread::after{display:none}
  .page{padding:28px 18px 48px;min-height:0}
  .page.ja{border-top:1px dashed var(--gutter)}
  h1{font-size:25px}
  .en p{font-size:17px}
  .folio{display:none}
  body{padding:12px 0 150px}
  .spread{border-radius:0}
}
@media print{
  body{background:#fff;padding:0}
  .bar{display:none}
  .spread{box-shadow:none;break-after:page;margin:0;max-width:none}
  .para.on{background:none;box-shadow:none}
  body.hide-en .en .body,body.hide-ja .ja .body{filter:none}
  @page{size:A4 landscape;margin:10mm}
}
</style>
</head>

<script>
const D = {"meta": {"series_en": "Technology & AI 2", "series_ja": "テクノロジー・AI 2", "track": "13", "title_en": "Washington closes the cloud loophole, and Nvidia's turmoil tests its resolve", "subtitle_en": "Tighter rules on remote access to chips make sense, but they will convince only if they are enforced evenly and explained in public", "title_ja": "米、クラウドの抜け穴をふさぐ　エヌビディアの混乱が問う執行の本気度", "subtitle_ja": "チップへの遠隔アクセス規制の強化は理にかなう。だが、公平に執行し、公に説明してこそ説得力を持つ", "source_en": "Original text based on reports from Fox News, Reuters, Gizmodo and The Wall Street Journal as relayed by AI Weekly, Nov. 2026", "date_ja": "2026年11月18日作成", "start_page": 14, "voice": "Samantha", "rate": 145, "pause_sec": 1.0, "engine": "openai", "openai_voice": "cedar"}, "sections": [{"heading_en": "", "heading_ja": "", "paragraphs": [{"en": "Washington has opened a new front in its technology contest with Beijing, and this time the target is not a chip but a connection. On Monday the Commerce Department issued an interim rule that would require export licenses for overseas data centers that give Chinese companies significant access to advanced American processors.", "ja": "米国は対中技術競争で新たな戦線を開いた。今回の標的は半導体そのものではなく、接続である。商務省は16日、中国企業に先端の米国製プロセッサーへの大きなアクセスを与える海外のデータセンターに、輸出許可を義務づける暫定規則を出した。"}, {"en": "The change targets a gap that officials have worried about for years. American export rules limit what physical hardware can be shipped to China. They said little about renting that hardware by the hour from a server farm in another country. Reports say facilities in Singapore, Thailand and Malaysia will be affected.", "ja": "当局が長年懸念してきた抜け穴を狙った措置である。米国の輸出規制は、中国に送れる物理的な機器を制限してきた。だが、他国のサーバー施設からその機器を時間単位で借りることには、ほとんど触れていなかった。報道によれば、シンガポール、タイ、マレーシアの施設が影響を受ける。"}, {"en": "The timing is hard to miss. President Trump is preparing to travel to China to meet President Xi Jinping, and both sides are trying to protect a fragile truce on trade. A tougher rule on chips lets Washington arrive at the table with leverage.", "ja": "時期は見逃せない。トランプ大統領は習近平国家主席との会談のため訪中を準備しており、双方は脆弱な貿易休戦を守ろうとしている。半導体規制の強化は、交渉に臨む米国に交渉材料を与える。"}, {"en": "Yet the rule did not arrive in a vacuum. It landed in the middle of a scandal that has shaken the most valuable company in the artificial intelligence industry and raised a hard question about whether the government has been enforcing its own rules.", "ja": "しかし、この規則は真空の中で生まれたわけではない。人工知能産業で最も価値の高い企業を揺るがした不祥事のさなかに出た。政府が自らの規則を実際に執行してきたのか、という重い問いも突きつけている。"}], "vocab": [{"w": "front", "m": "戦線、分野"}, {"w": "interim rule", "m": "暫定規則"}, {"w": "export license", "m": "輸出許可"}, {"w": "processor", "m": "プロセッサー"}, {"w": "gap", "m": "抜け穴、隙間"}, {"w": "restrict", "m": "制限する"}, {"w": "facility", "m": "施設"}, {"w": "fragile truce", "m": "脆弱な休戦"}, {"w": "leverage", "m": "交渉上の優位、てこ"}, {"w": "counterpart", "m": "交渉相手"}, {"w": "in a vacuum", "m": "他と切り離されて"}]}, {"heading_en": "A scandal at the top of Nvidia", "heading_ja": "エヌビディア首脳陣の不祥事", "paragraphs": [{"en": "Last week Jensen Huang stepped down as chief executive of Nvidia, the company he cofounded and led for more than thirty years. Reports linked his departure to a personal relationship with a woman whom some American officials suspect of having ties to Chinese intelligence. Those suspicions have not been proven.", "ja": "先週、ジェンスン・フアン氏は共同創業し30年以上率いてきたエヌビディアの最高経営責任者を退いた。報道は、退任を、米当局の一部が中国の情報機関との関係を疑う女性との個人的関係に結びつけている。ただし、その疑いは立証されていない。"}, {"en": "The woman once worked at Megaspeed, a Singapore based cloud company accused of helping Chinese firms obtain advanced Nvidia chips. Megaspeed says she left in August of last year, denies any wrongdoing and has opened an internal investigation. Nvidia says it studied the deployments and counted every one.", "ja": "この女性はかつて、中国企業による先端のエヌビディア製チップ入手を手助けしたと非難されるシンガポールのクラウド企業、メガスピードに勤めていた。同社は女性が昨年8月に退社したと述べ、不正を否定し、内部調査を始めた。エヌビディアは、導入先を調べ尽くしたと説明している。"}, {"en": "Treasury Secretary Scott Bessent said that four federal agencies had supported putting Megaspeed on a trade blacklist for months, yet the Commerce Department did not act. A senator has since accused the Commerce Secretary of sitting on national security warnings. Mr. Trump says he has full confidence in him.", "ja": "ベッセント財務長官は、4つの連邦機関が数か月前からメガスピードの貿易ブラックリスト入りを支持していたのに、商務省は動かなかったと述べた。その後、ある上院議員は商務長官が安全保障上の警告を放置したと非難した。トランプ氏は長官への全面的な信頼を示している。"}, {"en": "Mr. Trump also said he would not mind seeing Mr. Huang return, and that he believes the executive has learned a lesson. Meanwhile a petition urging the board to bring him back has gathered well over one hundred seventy thousand signatures. The board, for its part, has hired a search firm.", "ja": "トランプ氏はまた、フアン氏の復帰も構わず、本人は教訓を得たと思うとも語った。一方、取締役会に復帰を求める嘆願書には17万を超える署名が集まった。取締役会は、後任探しのため人材紹介会社を起用した。"}], "vocab": [{"w": "step down", "m": "退任する"}, {"w": "cofound", "m": "共同創業する"}, {"w": "suspect", "m": "疑う"}, {"w": "intelligence", "m": "情報機関、諜報"}, {"w": "accuse A of B", "m": "AをBで非難する"}, {"w": "deny wrongdoing", "m": "不正を否定する"}, {"w": "blacklist", "m": "ブラックリスト"}, {"w": "sit on", "m": "放置する"}, {"w": "national security", "m": "国家安全保障"}, {"w": "petition", "m": "嘆願書、署名運動"}, {"w": "signature", "m": "署名"}, {"w": "search firm", "m": "人材紹介会社"}]}, {"heading_en": "Why the loophole mattered", "heading_ja": "抜け穴が重大だった理由", "paragraphs": [{"en": "The remote access loophole matters because modern artificial intelligence is built less by owning machines than by renting enormous amounts of computing power. A laboratory in Shanghai does not need a single restricted chip in its own building if it can train a model on servers in Kuala Lumpur.", "ja": "遠隔アクセスの抜け穴が重要なのは、現代の人工知能が、機械を所有するよりも膨大な計算能力を借りることで築かれるからだ。上海の研究所は、クアラルンプールのサーバーでモデルを訓練できるなら、自前の建物に規制対象のチップを1枚も置く必要がない。"}, {"en": "Reports also say Chinese firms have been hurrying to sign cloud contracts abroad before the door closes. That suggests the gap was real, and widely understood. It also suggests that any rule announced in advance gives its targets time to adapt.", "ja": "報道によれば、中国企業は扉が閉まる前に海外でクラウド契約を結ぼうと急いできた。抜け穴は現実のもので、広く知られていたことをうかがわせる。また、事前に発表された規則は対象に適応する時間を与えてしまう。これは、慎重で遅い政策決定の弱点でもある。"}, {"en": "There is a fair counterargument from industry. American chipmakers earn a large share of their revenue abroad, and sweeping limits can push customers toward Chinese rivals. Nvidia has long argued that selling to China keeps the world hooked on American technology and funds the next generation of research.", "ja": "産業界からの反論にも一理ある。米国の半導体企業は収益の大きな部分を海外で稼いでおり、広範な制限は顧客を中国の競合に向かわせかねない。エヌビディアは長年、中国への販売が世界を米国の技術に依存させ、次世代の研究資金にもなると主張してきた。"}, {"en": "That argument has force, but it works only if the rules are enforced evenly. When a company, or a regulator, is seen to bend them for friends, the case for open markets weakens, and so does public trust in every executive who makes it.", "ja": "この主張には説得力があるが、規則が公平に執行されて初めて成り立つ。企業にせよ規制当局にせよ、親しい相手のために規則を曲げたと見られれば、自由な市場の論拠は弱まる。それを唱えるあらゆる経営者への信頼も揺らぐ。"}], "vocab": [{"w": "remote access", "m": "遠隔アクセス"}, {"w": "enormous", "m": "莫大な"}, {"w": "rival", "m": "競合相手"}, {"w": "sweeping", "m": "広範な"}, {"w": "hook", "m": "夢中にさせる、依存させる"}, {"w": "fund", "m": "資金を出す"}, {"w": "enforce", "m": "執行する"}, {"w": "evenly", "m": "公平に"}, {"w": "bend the rules", "m": "規則を曲げる"}, {"w": "public trust", "m": "国民の信頼"}, {"w": "adapt", "m": "適応する"}]}, {"heading_en": "What Japan should take from this", "heading_ja": "日本が学ぶべきこと", "paragraphs": [{"en": "For Japan, the lessons are practical. Japanese companies supply materials and equipment to the same global chip chain, and a company in Tokyo can find itself caught between Washington's rules and Beijing's retaliation. Clear guidance from the government would help firms plan before a crisis arrives.", "ja": "日本にとっての教訓は実務的である。日本企業は同じ世界の半導体供給網に素材や装置を供給しており、東京の企業が米国の規則と中国の報復の板挟みになる可能性がある。危機が来る前に企業が備えられるよう、政府の明確な指針が役立つ。"}, {"en": "Japan is also building its own artificial intelligence capacity, and many of its data centers rely on American chips. Tokyo should make sure that its own export controls and cloud rules are strong enough to deny any route to restricted customers, so that it is never named as a loophole.", "ja": "日本も独自の人工知能基盤を整備しており、データセンターの多くは米国製チップに依存している。東京は、自国の輸出管理とクラウドの規則が、規制対象の顧客への経路を断てるほど強固であることを確認すべきだ。抜け穴と名指しされてはならない。"}, {"en": "Washington, for its part, needs to separate two problems. Closing a technical gap is sensible policy. Deciding who runs a company, or who gets favored treatment, is something else. If the government is to name national champions, as reports suggest, it must explain the standards in public.", "ja": "米国の側も、2つの問題を切り分ける必要がある。技術的な抜け穴をふさぐのは妥当な政策だ。だが、誰が企業を率いるか、誰が優遇されるかは別の問題である。報道のとおり政府が国家的な代表企業を指名するなら、その基準を公に説明しなければならない。"}], "vocab": [{"w": "supply chain", "m": "供給網"}, {"w": "retaliation", "m": "報復"}, {"w": "caught between", "m": "板挟みになる"}, {"w": "guidance", "m": "指針"}, {"w": "capacity", "m": "能力、基盤"}, {"w": "rely on", "m": "依存する"}, {"w": "deny", "m": "断つ、拒む"}, {"w": "route", "m": "経路"}, {"w": "sensible", "m": "妥当な"}, {"w": "favored treatment", "m": "優遇"}, {"w": "national champion", "m": "国家的代表企業"}, {"w": "standard", "m": "基準"}]}], "timings": [[0.0, 19.2], [20.2, 38.32], [39.32, 55.18], [56.18, 70.94], [71.94, 88.46], [89.46, 108.7], [109.7, 126.72], [127.72, 144.33], [145.33, 163.93], [164.93, 181.44], [182.44, 201.16], [202.16, 218.53], [219.53, 236.93], [237.93, 254.49], [255.49, 273.44]], "audio": "audio.m4a"};
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
const KEY = 'shadow:' + D.meta.title_en;

$('#book').innerHTML = html;

const au = $('#au');
// 音声を丸ごと読み込んでから再生する（Range 非対応のサーバーでもシークできるように）
fetch(D.audio).then(r => { if (!r.ok) throw 0; return r.blob(); })
  .then(b => au.src = URL.createObjectURL(b)).catch(() => au.src = D.audio);
const T = D.timings, fmt = t => `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
let loop = false, cur = -1;
const idxAt = t => { for (let i = T.length - 1; i >= 0; i--) if (t >= T[i][0] - 0.05) return i; return 0; };
const seekTo = i => { i = Math.max(0, Math.min(T.length - 1, i)); au.currentTime = T[i][0]; mark(i); au.play(); };
function mark(i){
  if (i === cur) return; cur = i;
  document.querySelectorAll('.para.on').forEach(e => e.classList.remove('on'));
  document.querySelectorAll(`.para[data-i="${i}"]`).forEach(e => e.classList.add('on'));
  const el = document.querySelector(`.en .para[data-i="${i}"]`);
  if (el && !au.paused) { const r = el.getBoundingClientRect(); if (r.top < 60 || r.bottom > innerHeight - 110) el.scrollIntoView({behavior:'smooth', block:'center'}); }
}
au.addEventListener('loadedmetadata', () => $('#dur').textContent = fmt(au.duration));
au.addEventListener('timeupdate', () => {
  const t = au.currentTime;
  if (loop && cur >= 0 && t >= T[cur][1] + 0.4) { au.currentTime = T[cur][0]; return; }
  mark(idxAt(t));
  $('#cur').textContent = fmt(t);
  if (au.duration) $('#pos').value = t / au.duration * 1000;
});
au.addEventListener('play', () => $('#play').textContent = '❚❚');
au.addEventListener('pause', () => $('#play').textContent = '▶');
$('#play').onclick = () => au.paused ? au.play() : au.pause();
$('#prev').onclick = () => seekTo((cur < 0 ? 0 : cur) - 1);
$('#next').onclick = () => seekTo(cur + 1);
$('#pos').oninput = e => { if (au.duration) au.currentTime = e.target.value / 1000 * au.duration; };
$('#rate').onchange = e => au.playbackRate = +e.target.value;
const tog = (id, fn) => $(id).onclick = e => { e.currentTarget.classList.toggle('on'); fn(e.currentTarget.classList.contains('on')); };
tog('#loop', v => loop = v);
tog('#hideEn', v => document.body.classList.toggle('hide-en', v));
tog('#hideJa', v => document.body.classList.toggle('hide-ja', v));
document.addEventListener('click', e => {
  const p = e.target.closest('.para'); if (p) return seekTo(+p.dataset.i);
  const t = e.target.closest('.track'); if (t) { const s = +t.dataset.s; let i = 0; for (let k = 0; k < s; k++) i += D.sections[k].paragraphs.length; seekTo(i); }
});
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.k; if (k) { checked[k] = e.target.checked; store.set(KEY, checked); } });
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); $('#play').click(); }
  if (e.code === 'ArrowRight') seekTo(cur + 1); if (e.code === 'ArrowLeft') seekTo(cur - 1); });
</script>
</body>
</html>
